jay/furniture-library-images/main/sofa/nz_hist_history.jpeg\" alt=\"풀리아의 올리브 나무 — 브랜드가 쓰는 뿌리 상징\"></div>\n\n<p><strong>1973 · 산테라모</strong> — 8월 화재로 공장을 잃고\n바리 인근 <strong>산테라모 인 콜레(Santeramo in Colle)</strong>의 공장으로 생산을 옮겼다.\n이곳이 지금 나뚜찌 그룹의 본사다.</p>\n\n<p><strong>1993 · 뉴욕 증시 상장</strong> — 5월 13일 <strong>NYSE</strong>에 상장했다(티커 NTZ).\n가죽 소파 대량 생산과 수출로 규모를 키운 결과였다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/nz_hist_family.jpeg\" alt=\"나뚜찌 가족\"></div>\n\n<p><strong>2005 · 무두질 공장</strong> — 자체 태너리가 이탈리아에서 처음으로\n유럽의 가장 엄격한 환경 규제를 통과했다(ISO 14001).\n가죽의 원산지·이력 추적·선별·가공을 전 과정 직접 관리한다는 점이 브랜드의 핵심 자산이다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/nz_hist_tannery.jpeg\" alt=\"자체 태너리\"></div>\n\n<p><strong>2024 · 65주년</strong> — 하이포인트 마켓과 밀라노 디자인위크에서 65주년을 알렸다.</p>\n\n<hr><h3>② 두 개의 라인</h3>\n\n<ul>\n<li><strong>Natuzzi Italia</strong> — 이탈리아 감성을 담은 디자인 라인.\n클라우디오 벨리니, 마우로 리파리니, 만조니 &amp; 타피나시, 니카 주판츠, 마르칸토니오 등이 참여한다.</li>\n<li><strong>Natuzzi Editions</strong> — 여러 문화권의 생활 방식을 반영하는 대중 라인.\n리클라이너와 모듈 구성 비중이 높다.</li>\n</ul>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/nz_hist_arte.jpeg\" alt=\"Natuzzi Italia\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/nz_hist_editions.jpeg\" alt=\"Natuzzi Editions\"></div>\n\n<hr><h3>③ Harmony Chain — 수직 계열화</h3>\n\n<p>나뚜찌가 스스로 정의하는 가치사슬은 <strong>Harmony Chain</strong>이다.\n시장 관찰 → 디자인 싱킹 → 도면 → 프로토타입 → 스타일 센터 → 태너리 → 공장 → 유통까지\n<strong>외주 없이</strong> 자기 손 안에서 돌린다는 뜻이다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/nz_hist_designthinking.jpeg\" alt=\"Design Thinking\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/nz_hist_drawings.jpeg\" alt=\"Technical Drawings\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/nz_hist_stylecenter.jpeg\" alt=\"Style Center\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/nz_hist_factory.jpeg\" alt=\"풀리아 공장\"></div>\n\n<p><strong>디자인 싱킹</strong> 단계는 파스콸레 나뚜찌가 직접 조율하며 사내·사외 디자이너가 함께 들어간다.\n<strong>나뚜찌 아틀리에</strong>에서는 장인들이 가위·바늘·실만으로 도면을 실물 프로토타입으로 옮긴다.</p>\n\n<p><strong>스타일 센터</strong>는 R&amp;D 의 심장이다. 여기서 각 프로젝트의 조형 코드가 정해지고,\n디자인·기능·소재·색의 조합을 안내하는 <strong>Harmony Codes</strong>가 적용된다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/nz_hist_harmonycodes.jpeg\" alt=\"Harmony Codes\"></div>\n\n<p>풀리아의 자체 공장은 품질 타협도 외주도 없이 운영된다.\n나뚜찌는 <strong>4.0 공장</strong>에 먼저 투자한 회사이기도 하다.\n유통은 직영 스토어·갤러리와 도매, 그리고 Natuzzi Projects Division 으로 나뉜다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/nz_hist_retail.jpeg\" alt=\"나뚜찌 스토어\"></div>\n\n<hr><h3>④ 이 라이브러리의 데이터에 대해</h3>\n\n<p>나뚜찌 사이트는 흰 배경 제품컷을 페이지가 아니라\n<strong>컨피규레이터 API</strong>(api.natuzzi.com/api/presets/&lt;슬러그&gt;/preview)에서 그린다.\n이 라이브러리의 제품컷·가격·치수·외피(가죽/패브릭)는 모두 그 API 의 <strong>대표 구성</strong> 값이다.\n가격은 <strong>미국 스토어 정가(USD)</strong>이고, 괄호 안이 그 가격에 해당하는 구성이다.</p>\n\n<p>연도는 공란이다. 나뚜찌는 제품 페이지에 출시 연도를 표기하지 않는다.</p>\n\n<p>사이트맵에서 추린 소파 67건 중 <strong>11건</strong>(Habita·Pagoda·Puzzle·Giulivo·Copenhagen·\nCapri·Frame·Verona·Leale·Timoti·Sollievo)은 preview API 에 프리셋이 없고\n페이지에도 제품컷이 없어(연출컷뿐) 제외했다. 남은 <strong>56건</strong>을 실었다.</p>\n", "logo": "https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/natuzzi_logo.svg"}, "flexform": {"summary": "1959년 갈림베르티 형제가 브리안차 메다에 연 공방에서 시작한 이탈리아 가족 기업. 지금 3대째다. 브랜드명은 'Flexible Form'의 줄임말이고, 생산은 지금도 메다 한 곳에서만 한다. 1970년대부터 40년 넘게 이어온 안토니오 치테리오와의 협업이 브랜드의 성격을 만들었다.", "founded": "1959", "hq": "Meda, Brianza, Italy", "signature": "Groundpiece, Soft Dream, Wing, Romeo, Max, Victor", "source_url": "https://www.flexform.it/en/about/all-articles/the-story-of-a-family-business", "html": "\n<p><strong>Flexform</strong>은 이탈리아 북부 <strong>브리안차(Brianza)</strong> 가구 산지에서 시작한 가족 기업이다.\n지금 3대째다. 이탈리아 가구 디자인이라는 세계적 현상이 1960년대에 태어난 바로 그 자리에,\n1900년대 초부터 목재·금속·업홀스터리를 다뤄 온 작은 공방들의 역사와\n가까운 밀라노 건축대학에서 배출된 거장들의 역사가 겹쳐 있다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/ff_hist_story.jpg\" alt=\"Flexform di Galimberti 초기 매장\"></div>\n\n<p><strong>1959년</strong>, 갈림베르티(Galimberti) 형제가 <strong>Flexform di Galimberti</strong>라는 이름의\n공방을 열었다. 곧이어 낸 첫 쇼룸에 걸린 소파와 암체어는 전후 밀라노의 고급 건물,\n코모 호수를 내려다보는 빌라, 그리고 <strong>라 스칼라 극장 로비</strong>까지 들어갔다.</p>\n\n<hr><h3>① 연혁</h3>\n\n<p><strong>1959 · 공방</strong> — 갈림베르티 형제가 메다(Meda)에 공방을 연다.\n브랜드명 FLEXFORM 은 <strong>Flexible Form</strong>의 줄임말이다.</p>\n\n<p><strong>1967 · 법인화</strong> — 창업자의 자녀들이 공방을 산업 설비로 바꾸고\n<strong>Flexform S.p.A.</strong>로 법인화한다. 이 시기 조 콜롬보, 아스나고-벤데르,\n치니 보에리, 로돌포 보네토 같은 당대 최전선의 디자이너들과 손을 잡았다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/ff_hist_meda3.jpg\" alt=\"메다 공방의 수작업\"></div>\n\n<p><strong>1970년대 · 방향 전환과 수출</strong> — 과거 양식의 반복을 버리고\n<strong>오리지널 컨템퍼러리 디자인</strong>으로 생산의 무게를 옮긴다.\n동시에 이탈리아 밖으로 시장을 열기 시작해, 절제된 스타일과 편안함에 공감이 컸던\n독일어권 유럽부터 진출했다. 이후의 해외 성장은 멈추지 않았다.</p>\n\n<p>같은 시기 회사가 내린 또 하나의 결정이 브랜드의 성격을 바꿨다.\n젊은 건축가 겸 디자이너 <strong>안토니오 치테리오</strong>에게 투자한 것이다.\n1950년 메다에서 태어나 1972년 자기 스튜디오를 연 그와의 협업은\n<strong>40년 넘게 한 번도 끊기지 않았다</strong>. 플렉스폼의 아이덴티티는 사실상 그가 만들었다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/ff_max.png\" alt=\"Max, Antonio Citterio, 1983\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/ff_magister.png\" alt=\"Magister, Antonio Citterio · Paolo Nava, 1982\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/ff_ginger.png\" alt=\"Ginger, Antonio Citterio, 1984\"></div>\n\n<p><strong>1980년대 · 패밀리 소파</strong> — Magister(1982), Max(1983), Ginger·Victor(1984) 가\n잇따라 나온다. 이 흐름은 회사 안에서 <strong>패밀리 소파(Family Sofas)</strong>라 불렸고,\n그 선구가 된 모델이 Nonnamaria 다.</p>\n\n<p><strong>2001 · Groundpiece</strong> — 플렉스폼 최대의 베스트셀러가 등장한다.\n<strong>해체된 선과 새로운 비례</strong>, 낮고 깊은 좌면으로 소파에 앉는다는 개념 자체를 바꿨다.\n오늘날 사람들은 소파에서 쉬고, TV 를 보고, 책을 읽고, 일하고, 밥까지 먹는다 —\n이 관찰에서 팔걸이를 다시 설계한다는 발상이 나왔고, Groundpiece 의 팔걸이는\n패딩 쿠션형과 콘솔형 두 가지가 됐다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/ff_groundpiece.png\" alt=\"Groundpiece, 2001\"></div>\n\n<p><strong>2010년대 이후</strong> — Soft Dream(2010), Grandemare(2011), Wing(2014),\nAdda(2017), Romeo(2019) 로 이어진다. 로베르토 라제로니(Alfred·Ermione·Drop·Dragonfly),\n카를로 콜롬보(Newbridge·Edmond) 등이 합류하며 컬렉션의 폭이 넓어졌다.\n최근에는 Max 출시 40년 만에 치테리오가 직접 다시 손본 <strong>Supermax</strong>가 나왔다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/ff_wing.png\" alt=\"Wing, Antonio Citterio, 2014\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/ff_romeo.png\" alt=\"Romeo, Antonio Citterio, 2019\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/ff_supermax.png\" alt=\"Supermax — Max 의 40년 뒤 버전\"></div>\n\n<hr><h3>② Made in Meda</h3>\n\n<p>플렉스폼의 성공을 설명하는 슬로건은 <strong>Made in Italy</strong>, 더 정확히는\n<strong>Made in Meda</strong>다. 디자인 컨셉부터 완제품까지 전부 이탈리아 한 나라 안에서 만들고,\n<strong>생산 시설은 메다 한 곳뿐</strong>이다. 본사에서 1km 도 떨어지지 않은 거리다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/ff_hist_meda1.jpg\" alt=\"가죽 스티칭\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/ff_hist_meda2.jpg\" alt=\"프레임 조립\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/ff_hist_meda4.jpg\" alt=\"재단\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/ff_hist_meda5.jpg\" alt=\"금속 부속\"></div>\n\n<p>브리안차 지구가 가구 세계에서 유명한 이유는 세대를 넘겨 기술이 전수되는\n<strong>전문 장인</strong>들이 밀집해 있기 때문이다. 플렉스폼은 그 장인들을 쓰는 데 공을 들인다.\n공급망도 같은 기준으로 관리한다. 가죽·패브릭·목재·금속은 물론,\n소파의 상징이 된 <strong>깃털과 다운 충전재</strong>는 원산지가 인증된 것만 쓴다.</p>\n\n<hr><h3>③ 스타일</h3>\n\n<p>플렉스폼은 다이닝·베드룸까지 만들지만 중심은 언제나 <strong>소파</strong>다.\n브랜드가 스스로 정의하는 언어는 럭셔리가 아니라 <strong>discreet elegance</strong>,\n즉 드러내지 않는 우아함이다. 회사는 자사 소파를 <strong>패션의 네이비 블레이저</strong>에 비유한다.\n단순하고, 해체돼 있고, 작은 디테일까지 정제돼 있다는 뜻이다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/ff_hist_style1.jpg\" alt=\"Flexform 인테리어\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/ff_hist_style3.jpg\" alt=\"Flexform 인테리어\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/ff_hist_style4.jpg\" alt=\"Flexform 인테리어\"></div>\n\n<p>컬러 팔레트는 <strong>모란디 팔레트(Morandi palette)</strong>라 부른다.\n아이보리와 샌드, 따뜻한 그레이 같은 중성색에 리넨·코튼·캐시미어,\n그리고 카우하이드·토바코·허니·도브그레이 계열의 가죽을 쓴다.\n색은 드물게, 악센트로만 들어간다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/ff_hist_showroom1.jpg\" alt=\"Meda 쇼룸\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/ff_hist_showroom3.jpg\" alt=\"Meda 쇼룸\"></div>\n\n<hr><h3>④ 이 라이브러리의 데이터에 대해</h3>\n\n<p>플렉스폼은 제품 페이지에 <strong>출시 연도를 표기하지 않는다</strong>.\n그래서 연도는 두 가지 출처로만 채웠다. 하나는 퍼시스 소파 디자인팀 컨플루언스 문서에 적힌 연도\n(Groundpiece 2001, Soft Dream 2010, Grandemare 2011, Wing 2014, Ermione 2016, Adda 2017, Romeo 2019),\n다른 하나는 제품 설명문 안에 직접 명시된 연도(Magister 1982, Max 1983, Ginger·Victor 1984)다.\n나머지는 공란으로 뒀다.</p>\n\n<p>수집 범위는 실내 소파 47건이다.\nsectional sofas(29) · stand-alone sofas(중복 제외 14) · sofa beds(4).\n암체어·오토만·셰이즈롱은 소파 패밀리와 겹치거나 1인 시트여서 뺐고, 아웃도어 라인도 제외했다.</p>\n", "logo": "https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/flexform_logo.svg"}, "fritzhansen": {"summary": "1872년 코펜하겐의 목수 프리츠 한센이 영업 허가를 받으며 시작한 덴마크 브랜드. 덴마크 의회·대법원 납품으로 자리잡았고, 1950년대 아르네 야콥센과의 협업으로 성형 목재 가구의 기준을 세웠다. 1979년 가족 기업에서 벗어나 스칸디나비스크 홀딩 산하로 들어갔다.", "founded": "1872", "hq": "Allerød, Denmark", "signature": "Swan Sofa, Series 3300, PK31, Lissoni Sofa, Alphabet, Favn", "source_url": "https://www.fritzhansen.com/en/about-us/our-story/heritage-timeline", "html": "\n<p><strong>Fritz Hansen</strong>의 역사는 <strong>1872년</strong>, 낙스코프(Nakskov) 출신의 목수\n프리츠 한센이 코펜하겐에서 영업 허가를 받은 데서 시작한다. 1885년 자기 이름을 건 가구 제작소를 열었고,\n2년 만에 크리스티안스하운(Christianshavn)의 공방이 본궤도에 올랐다.\n여기서 프리츠와 아들 <strong>크리스티안</strong>이 만든 고품질 가구가 이후 브랜드의 성격을 결정했다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fh_hist_legacy.jpg\" alt=\"Fritz Hansen 초기 아카이브\"></div>\n\n<p>첫 50년은 공공 프로젝트로 채워진다. 크리스티안스보르 궁의 <strong>덴마크 의회와 대법원</strong>,\n대학 도서관, 코펜하겐 시청 등 굵직한 기관 가구를 납품하며 이름을 알렸다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fh_hist_christianshavn.jpg\" alt=\"크리스티안스하운 공방\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fh_hist_firstchair.jpg\" alt=\"1878년 첫 의자\"></div>\n\n<hr><h3>① 연혁</h3>\n\n<p><strong>1872 · 창업</strong> — 프리츠 한센이 코펜하겐에서 목수 영업 허가를 취득.\n<strong>1885</strong>년 자신의 이름으로 가구 회사를 설립한다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fh_hist_parliament.jpg\" alt=\"덴마크 의회 의자, Thorvald Jørgensen, 1918\"></div>\n\n<p><strong>1900년대 · 증기 굽힘</strong> — 아들 크리스티안이 <strong>스팀 벤딩</strong> 기법을 실험하기 시작한다.\n이 10년 사이 기술이 정교해지면서 프리츠한센은 <strong>성형·적층 목재 가구의 세계적 선두</strong>가 된다.</p>\n\n<p><strong>1930년대 · 기능주의</strong> — 독일 기능주의를 참조한 스칸디나비아 디자인이 자리를 잡는다.\n프리츠한센은 <strong>덴마크 최초의 스틸 가구</strong>를 내놓고, 카레 클린트의 처치 체어를 생산한다\n(이 의자는 2004년까지 컬렉션에 남아 있었다).</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fh_hist_schlegel.jpg\" alt=\"Lounge chair, Frits Schlegel, 1931\"></div>\n\n<p><strong>1940년대 · 전시와 호두나무</strong> — 2차 대전 중에도 공장을 넓혔다.\n혹한으로 덴마크 호두나무가 대량 고사하자 그 목재를 사재기해 새 시리즈를 냈고, 언론의 호평과 함께 성공한다.\n<strong>1944년 한스 J. 베그너</strong>가 프리츠한센을 위한 첫 아이콘 <strong>China Chair</strong>를 만든다.\n이듬해 <strong>뵈르게 모겐센의 Spoke-back 소파</strong>가 나오는데, 시대를 앞서간 탓에 한참 뒤에야 양산에 들어가\n'가장 덴마크적인 소파'로 재소개된다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fh_hist_canada.jpg\" alt=\"Canada chair, Christian E. Hansen, 1940\"></div>\n\n<p><strong>1950년대 · 아르네 야콥센의 시대</strong> — 거의 20년에 걸친 협업 끝에\n<strong>Ant 체어(1952)</strong>로 야콥센의 돌파구가 열린다. 흐비트 &amp; 묄고르의 압축 성형 AX 체어에서 영감을 얻은 이 의자와\n목재 베니어 성형 기술의 도입은 브랜드 역사의 분기점이 됐고, 이후 <strong>Series 7</strong>으로 이어진다.\n같은 시기 야콥센은 코펜하겐 SAS 로열 호텔을 위해 <strong>Egg</strong>와 <strong>Swan</strong>을,\nSAS 터미널을 위해 건축적인 <strong>Series 3300</strong> 라운지 시리즈를 디자인한다.\n1955년에는 베르너 판톤이 벤트 스틸로 Bachelor 체어를 만든다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fh_hist_pk0.jpg\" alt=\"PK0, Poul Kjærholm, 1951\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fh_hist_ant.jpg\" alt=\"Ant, Arne Jacobsen, 1952\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fh_hist_series7.jpg\" alt=\"Series 7, Arne Jacobsen, 1955\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fh_hist_bachelor.jpg\" alt=\"Bachelor chair, Verner Panton, 1956\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fh_swan.jpg\" alt=\"Swan Sofa 3321, 1958\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fh_s3300.jpg\" alt=\"Series 3300, 1956\"></div>\n\n<p><strong>1960년대 · 알레뢰드 이전</strong> — 1963년 코펜하겐 북쪽 <strong>알레뢰드(Allerød)</strong> 생산시설에\n공장동 세 개를 증설하고, 1965년 본사를 크리스티안스하운에서 알레뢰드로 옮긴다(쇼룸도 함께).\n브루노 매트손과 피에트 하인이 함께 만든 <strong>슈퍼엘립스 테이블</strong>이 큰 성공을 거두고,\n모겐센의 Spoke-back 소파와 베그너의 China Chair가 재출시돼 역시 잘 팔린다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fh_hist_oxford.jpg\" alt=\"Oxford chair, Arne Jacobsen, 1962\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fh_hist_kar.jpg\" alt=\"Kar chair, Henning Larsen, 1967\"></div>\n\n<p><strong>1979 · 가족 기업의 끝</strong> — 1979년 첫 근무일, 107년 된 회사가 더 이상 가족의 손에 남지 않는다고 발표하며\n지분 75%를 <strong>스칸디나비스크 홀딩(Skandinavisk Holding)</strong>에 매각한다.\n이 시기 베르너 판톤이 아방가르드를 이끌었고, 회사는 다시 야콥센과 클래식 쪽으로 무게를 옮긴다.</p>\n\n<p><strong>1980년대 · 케홀름 컬렉션 인수</strong> — 스칸디나비스크 홀딩의 대규모 투자와 개혁으로 체질이 바뀐다.\n1983년 코펜하겐 벨라 센터 가구 박람회에서 신작만으로 채운 전시를 열어 덴마크 최대 가구 제조사의 위치를 확인시켰다.\n이 시기 <strong>폴 케홀름이 1951~1980년에 디자인한 케홀름 컬렉션의 권리</strong>를 사들이고,\nKevi 컬렉션과 Munch Møbler도 인수한다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fh_pk31.jpg\" alt=\"PK31 Sofa, Poul Kjærholm, 1958\"></div>\n\n<p><strong>1990년대 · 글로벌 브랜드로</strong> — 다이닝룸·회의실·대기공간·오피스·주거 다섯 영역에 집중한다.\n1998년 <strong>야콥 홀름</strong>이 CEO로 취임해 생산 회사에서 최종 소비자를 바라보는 글로벌 브랜드로 전환을 이끌고,\n1999년 바싱에뢰드(Vassingerød)에 새 공장을 열어 생산 능력을 크게 키운다. 쇼룸과 뮤지엄도 함께 문을 열었다.</p>\n\n<p><strong>2000년대 · Republic of Fritz Hansen</strong> — 2000년 <strong>Republic of Fritz Hansen</strong>을 도입한다.\n가구를 '개인의 표현'으로 보는 전략 전환이었다. 캐스퍼 살토의 Ice 시리즈와 Little Friend,\n<strong>피에로 리소니</strong>와 세실리에 만즈의 작업이 새 고객층을 끌어왔고,\n동시에 야콥센의 Oxford 체어 같은 클래식을 현대 감각으로 되살리는 작업이 병행됐다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fh_lissoni.jpg\" alt=\"Lissoni Sofa PL113, Piero Lissoni, 2006\"></div>\n\n<p><strong>2010년대 · 하이메 아욘</strong> — 2011년 스페인 디자이너 <strong>하이메 아욘</strong>과의 협업이 시작된다.\n조각적이면서 편안한 가구와 액세서리가 잇따라 나왔고, Favn·Ro·Lune·Plenum 같은 소파가 여기서 태어난다.\n2015년에는 'Series 7 60주년'을 기념하고, 덴마크 조명 회사 <strong>Lightyears</strong>를 인수한다.\n2016년에는 액세서리 컬렉션 <strong>Objects</strong>를 선보인다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fh_hist_favn.jpg\" alt=\"Favn, Jaime Hayon\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fh_ro.jpg\" alt=\"Ro Sofa, Jaime Hayon, 2017\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fh_plenum.jpg\" alt=\"Plenum, Jaime Hayon, 2018\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fh_hist_pluralis.jpg\" alt=\"Pluralis table\"></div>\n\n<hr><h3>② 컬렉션 구조</h3>\n\n<p>퍼시스 소파 디자인팀 자료는 프리츠한센 컬렉션을 두 갈래로 정리한다.</p>\n<ul>\n<li><strong>클래식 컬렉션</strong> — 아르네 야콥센의 Egg·Swan·Series 7,\n폴 케홀름의 PK22 체어와 PK80 데이베드 등 덴마크 건축가·디자이너의 대표작.</li>\n<li><strong>컨템퍼러리 컬렉션</strong> — 하이메 아욘, 피에로 리소니, 캐스퍼 살토, 세실리에 만즈 등\n현역 디자이너의 신작 가구와 액세서리.</li>\n</ul>\n\n<p>품질 관리에는 <strong>'프리미엄 체크(Premium Check)'</strong>라는 자체 제도를 둔다.\n모든 제품이 포장·배송 전에 숙련 인력의 검사를 거치도록 한 것으로,\n'사람이 쓰는 물건은 사람이 검사해야 한다'는 논리다.</p>\n\n<hr><h3>③ 이 라이브러리의 데이터에 대해</h3>\n\n<p>프리츠한센 사이트는 제품 정보를 전부 클라이언트에서 그리고, 시장(마켓)별로 취급 품목이 다르다.\n한국 스토어프론트에서 제품 데이터가 로드되지 않는 <strong>Favn·Lune·Fri·Reykjavik·Selandia</strong>는\n이번 수집에서 제외했다. 아웃도어 라인(구 Skagerak)인 Virkelyst도 다른 브랜드와 같은 기준으로 뺐다.\n연도와 디자이너는 각 제품 페이지의 'Designed by ○○○, 연도' 표기를 그대로 따랐다.</p>\n", "logo": "https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/fritzhansen_logo.svg"}, "rochebobois": {"summary": "1950년 자크 로슈의 매장과 슈샹 가문의 'Au Beau Bois'가 1960년 코펜하겐 살롱에서 만나 하나가 된 프랑스 브랜드. 전 세계 265개 쇼룸을 두고, 제작은 유럽의 작은 공방에서 주문 제작으로 한다.", "founded": "1960", "hq": "Paris, France", "signature": "Mah Jong, Bubble, Bombom, Ahoy", "source_url": "https://www.roche-bobois.com/en-US/history", "html": "<p><strong>Roche Bobois</strong>는 만날 일이 없었던 두 집안 — <strong>로슈(Roche) 가문과 슈샹(Chouchan) 가문</strong> —\n의 이야기에서 시작한다. 1950년 자크 로슈가 리옹 가(rue de Lyon)의 옛 <strong>알렉상드르 뒤마 극장</strong>을 사들여\n매장 두 곳을 열었다. 아들 필리프와 프랑수아가 합류해 회사의 방향을 함께 잡았고,\n민비엘·스타이너·에어본처럼 바우하우스의 영향을 받은 동시대 가구와 피에르 폴랭·마르크 베르티에 같은\n디자이너의 작업을 유통하기 시작했다. 같은 시기 슈샹 가문은 파리 세바스토폴 대로에서\n<strong>'Au Beau Bois'</strong>라는 가구점을 하고 있었다 — 나중에 <strong>Bobois</strong>가 되는 이름이다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/rb_mahjong.jpg\" alt=\"Mah Jong\"></div>\n\n<hr><h3>① 연혁</h3>\n\n<p><strong>1950,</strong> 자크 로슈가 옛 알렉상드르 뒤마 극장 자리에 매장 두 곳을 연다. 슈샹 가문은 'Au Beau Bois' 운영.</p>\n\n<p><strong>1960 — 만남.</strong> <strong>코펜하겐 살롱</strong>에서 스칸디나비아 가구를 발견한다.\n아직 서로 모르던 프랑수아·필리프 로슈와 파트릭·장클로드 슈샹이, 각자 파리에서 팔 가구를 수입하겠다는 생각으로\n같은 박람회에 갔다가 만났다. 함께 첫 카탈로그를 만들었고 그것이 전국 프랜차이즈의 출발이 됐다.</p>\n\n<p><strong>1961,</strong> <strong>엘르(Elle)</strong>지에 첫 전국 광고 캠페인을 낸다. 매출이 폭발했고,\n두 집안의 자원과 <strong>이름을 합치는 것</strong>의 이점이 증명됐다. 이때부터 Roche Bobois는 하나의 브랜드가 된다.</p>\n\n<p><strong>1970년대,</strong> 텔레비전의 보급이 가정의 구조를 바꾸면서 <strong>소파가 필수품</strong>이 됐다.\n소파가 'Les Contemporains' 컬렉션의 중심이 된다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/rb_bubble.jpg\" alt=\"Bubble\"></div>\n\n<p><strong>1980년대,</strong> 프랑스 전통 가구를 다시 해석한 <strong>'Les Provinciales'</strong> 컬렉션.</p>\n<p><strong>1990년대,</strong> 에스닉 감각을 섞는 흐름에 <strong>'Les Voyages'</strong> 컬렉션으로 답한다.\n로컬 가구 유통사 중 세계로 확장하는 데 성공한 몇 안 되는 사례가 됐다.</p>\n\n<p><strong>2000년대,</strong> 두 가지가 두드러진다. 볼로냐의 옛 루파리 궁부터 몬트리올의 미래적 건물까지\n<strong>전 세계 주요 도시로의 확장</strong>, 그리고 디자이너·건축가와의 <strong>파트너십 심화</strong>다.</p>\n\n<p><strong>2010,</strong> 창립 50주년. 이 해에 <strong>장 폴 고티에</strong>와의 파트너십이 시작된다.\n세계적 영향력을 가진 두 프랑스 브랜드가 패션과 인테리어가 공유하는 언어 — 창의성·미학·대담함·에너지 — 를\n함께 쓰기 시작한 것이다.</p>\n\n<p><strong>2020,</strong> 60주년. 아티스트 <strong>조아나 바스콘셀루스</strong>가 디자인한\n시팅·장식 컬렉션 <strong>Bombom</strong>을 내놓는다. 에너지 넘치고 낙관적이며 다채로운 이 컬렉션은\n브랜드의 핵심 가치인 창의성과 장인 기술을 그대로 보여준다. 동시에 온라인·매장 디지털화와\n<strong>에코디자인 컬렉션</strong>을 밀어붙인다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/rb_bombom.jpg\" alt=\"Bombom\"></div>\n\n<p><strong>2025,</strong> 호주 <strong>시드니에 첫 매장</strong>을 열며 5대륙 진출을 완성한다.\n동시에 중국 시장에서의 입지를 크게 강화했다.</p>\n\n<hr><h3>② 브랜드의 성격</h3>\n\n<p>로슈보부아는 스스로를 <strong>'프랑스식 삶의 방식(French Art de Vivre)'을 세계에 퍼뜨리는 브랜드</strong>로 규정한다.\n전 세계 <strong>265개 쇼룸</strong>을 운영하는 가구 디자인·유통의 선두 주자이면서,\n실제 제작은 <strong>유럽의 작은 공방들</strong>에서 주문 제작 방식으로 이루어진다. 커스터마이징 폭이 매우 넓다.</p>\n\n<p>협업 범위가 특이하게 넓은 것도 특징이다. 마르셀 반더스, 켄조 다카다, 오라 이토, 사샤 라킥,\n크리스토프 델쿠르, 스티븐 벅스, 조아나 바스콘셀루스, 지앙 총 얼 같은 디자이너·아티스트와 일하고,\n<strong>장 폴 고티에·미소니</strong> 같은 오트 쿠튀르 하우스와도 협업한다.</p>\n\n<hr><h3>③ 대표 제품</h3>\n\n<p><strong>Mah Jong</strong>(한스 호퍼) — 1970년대에 나온 모듈 시팅. 바닥에 두는 매트리스형 요소를\n자유롭게 쌓고 배열한다. 켄조 다카다, 장 폴 고티에, 미소니 버전의 커버 에디션이 계속 나온다.</p>\n\n<p><strong>Bubble</strong>(사샤 라킥) — 부푼 거품 같은 볼륨의 소파. Curve·Mini 등 파생형이 이어지고\n페드로 알모도바르 협업 에디션도 있다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/rb_bubblecurve.jpg\" alt=\"Bubble Curve\"></div>\n\n<p><strong>Bombom</strong>(조아나 바스콘셀루스, 2020) — 60주년 기념 컬렉션.</p>", "logo": "https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/rochebobois_logo.svg"}, "poliform": {"summary": "1942년 브리안차의 가족 공방에서 출발해 1970년 사촌 셋이 산업 기업으로 전환한 이탈리아 브랜드. 붙박이장과 시스템 가구로 먼저 자리잡았고, 소파 생산은 2010년에 시작했다.", "founded": "1970", "hq": "Inverigo, Brianza, Italy", "signature": "Saint-Germain, Brera, Westside, Bristol", "source_url": "https://www.poliform.it/en/poliform-world/human-company/", "html": "<p><strong>Poliform</strong>의 뿌리는 1942년으로 거슬러 올라간다. 스피넬리 가문과 안차니 가문이\n브리안차 지역 <strong>인베리고(Inverigo)</strong>에 작은 공방을 차린 것이 시작이다.\n1970년 사촌지간인 <strong>알베르토 스피넬리, 알도 스피넬리, 조반니 안차니</strong>가\n그 가족 공방을 <strong>현대적인 산업 기업으로 전환</strong>하며 Poliform을 세웠다.\n새 이름은 과거와의 결별을 뜻했고, 유연함·단순함·우아함·미래에 대한 개방성을 담았다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/pf_saintgermain.jpg\" alt=\"Saint-Germain\"></div>\n\n<hr><h3>① 연혁</h3>\n\n<p><strong>1942,</strong> 스피넬리·안차니 가문이 브리안차 인베리고에 작은 공방을 세운다.</p>\n<p><strong>1970,</strong> 사촌 셋이 <strong>Poliform</strong> 창립. 장인 기업에서 산업 기업으로.</p>\n<p><strong>1987,</strong> <strong>모듈성과 유연성</strong>이 이후 폴리폼 시스템 디자인의 뼈대가 된다.</p>\n<p><strong>1990,</strong> 유럽 시장에 진출하며 <strong>붙박이장(wardrobe) 부문의 선두</strong>로 자리잡는다.</p>\n<p><strong>1996,</strong> 이탈리아 주방 브랜드 <strong>Varenna</strong> 인수. 집 전체를 폴리폼 스타일로 채운다는 구상이었다.</p>\n<p><strong>2001,</strong> <strong>Poliform Contract</strong> 출범. 주거·리테일·호스피탈리티 분야의 대형 맞춤 프로젝트를 다룬다.</p>\n<p><strong>2010,</strong> <strong>업홀스터드 가구(소파) 생산 개시.</strong> 라이프스타일 전반으로 제품군을 넓히기 위한 결정이었다.\n— 즉 폴리폼의 소파 역사는 다른 이탈리아 브랜드보다 훨씬 짧다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/pf_westside.jpg\" alt=\"Westside\"></div>\n\n<p><strong>2018,</strong> 이탈리아 산업디자인협회(ADI)가 창업자들에게\n<strong>황금콤파스 평생공로상</strong>을 수여한다.</p>\n<p><strong>2020,</strong> 창립 50주년. 사진가 <strong>파올로 로베르시</strong>에게 회사의 역사를 시각적으로 서술하게 했다.</p>\n<p><strong>현재,</strong> 5대륙에 진출해 있으며, 일관된 스타일과 제품 정체성으로 집 전체를 아우르는 개념을 제안한다.</p>\n\n<hr><h3>② 브랜드의 성격</h3>\n\n<p>폴리폼의 디자인 철학은 <strong>교양 있고 동시대적인 아름다움, 타임리스한 우아함, 기술적 탁월함</strong>으로 요약된다.\n제품이 튀기보다 <strong>주변 건축과 섞이는 것</strong>을 지향하며, 시스템과 액세서리가 하나의 알아볼 수 있는\n미감으로 묶인다.</p>\n\n<p>'Human Company'라는 이름으로 내세우는 수치가 이 회사의 성격을 잘 보여준다 —\n이탈리아 공급사 비중 <strong>97%</strong>, 롬바르디아 지역 공급사 <strong>83%</strong>,\n지역 출신 직원 <strong>96%</strong>, 직원 수 <strong>711명</strong>. 브리안차 가구 산업 지구에 뿌리를 둔 채로 성장했다는 뜻이다.</p>\n\n<p>소파 라인의 중심 디자이너는 <strong>장마리 마소(Jean-Marie Massaud)</strong>다.\nBrera, Ernest, Joan, Owen, Savoy, Westside Soft가 그의 작업이고,\nSunday는 플라비아노 카프리오티, 2026 컬렉션부터는 <strong>야부 푸셸버그</strong>가 합류했다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/pf_brera.jpg\" alt=\"Brera\"></div>\n\n<hr><h3>③ 라이브러리에서 볼 때 주의할 점</h3>\n\n<p>폴리폼은 <strong>제품 페이지에 디자이너와 출시 연도를 표기하지 않는다.</strong>\n이 라이브러리의 디자이너 정보는 제품 설명문에 이름이 언급된 경우에만 채웠고,\n연도는 전부 비어 있다. 다른 브랜드와 연도 필터로 비교할 때 이 점을 감안해야 한다.</p>", "logo": "https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/poliform_logo.svg"}, "vitra": {"summary": "1934년 스위스에서 시작한 가구 브랜드. 전속 디자이너를 두지 않고 외부 디자이너와의 협업으로만 제품을 만든다. 1953년 임스 부부 디자인의 유럽 판매권을 사들이며 방향을 잡았고, 오피스와 리빙 양쪽에서 시팅류에 특화돼 있다.", "founded": "1934", "hq": "Birsfelden, Switzerland", "signature": "Alcove, Soft Work, Suita, Grand Sofà, Anagram", "source_url": "https://fursys.atlassian.net/wiki/spaces/RD/pages/626127753", "html": "<p><strong>Vitra</strong>는 1934년 사업을 시작한 이래 각기 다른 유명 디자이너와 협업하며 성장했다.\n디자이너 개개인의 아이덴티티가 그대로 느껴지는 제품을 내놓으면서 자기 색깔을 확실히 했고,\n비트라 디자인 뮤지엄과 비트라 캠퍼스 같은 건축물도 저마다 다른 건축가가 맡아 제각각의 정체성을 갖는다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/vt_conf_campus.jpg\" alt=\"Vitra Campus\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/vt_conf_projectvitra.jpg\" alt=\"Project Vitra\"></div>\n\n<hr><h3>① 연혁</h3>\n\n<p><strong>1934,</strong> 빌리 펠바움(Willi Fehlbaum), 스위스 바젤에서 상점 비품 제조사 설립.</p>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/vt_conf_1934.jpg\" alt=\"1934, Willi Fehlbaum\"></div>\n<p><strong>1950,</strong> 독일 바일 암 라인(Weil am Rhein)에 The Vitra Company 설립.</p>\n<p><strong>1953,</strong> 빌리 펠바움이 첫 미국 출장 중 뉴욕의 한 가구점에서\n<strong>찰스 &amp; 레이 임스</strong>의 가구를 발견한다.</p>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/vt_conf_1953discover.jpg\" alt=\"1953, 임스 가구를 발견하다\"></div>\n<p><strong>1957,</strong> 허먼밀러의 인가를 받아 임스 부부와 조지 넬슨이 디자인한 가구를 유럽에서 제작하기 시작.</p>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/vt_conf_1953license.jpg\" alt=\"허먼밀러 라이선스 생산 시작\"></div>\n<p><strong>1960,</strong> 베르너 팬톤과 함께 개발한 <strong>Panton Chair</strong> — 역사상 최초의 원피스 캔틸레버형\n몰드 플라스틱 의자. 비트라가 디자이너와 협업해 독자 개발한 첫 사례다.</p>\n<p><strong>1977,</strong> 빌리의 아들 <strong>롤프 펠바움</strong>이 경영을 인수. 장 프루베, 알바 알토를 비롯한\n모던 디자인 클래식과 임스·넬슨의 초기 가구를 수집하기 시작한다.</p>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/vt_conf_prouve.jpg\" alt=\"Jean Prouvé\"></div>\n<p><strong>1981,</strong> 초대형 화재로 공장 상당수가 전소. 존폐의 기로에서\n니콜라스 그림쇼의 제조 공장을 시작으로 프랭크 게리, 알바루 시자 등 세계적 건축가들에게 공장 설계를 맡겼고,\n이것이 <strong>비트라 캠퍼스의 시초</strong>가 됐다.</p>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/vt_conf_1981fire.jpg\" alt=\"1981년 화재\"></div>\n<p><strong>1984,</strong> 클래스 올덴버그와 쿠제 반 브루겐의 설치작 'Balancing Tools'가 캠퍼스에 세워진다.\n같은 해 허먼밀러와의 파트너십이 해제되면서 <strong>임스·넬슨·지라드의 유럽 및 중동 권리가 비트라에 양도</strong>됐다.</p>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/vt_conf_balancingtools.jpg\" alt=\"Balancing Tools\"></div>\n<p><strong>1988,</strong> 레이 임스의 죽음과 LA 임스 오피스 해체 이후, 임스 가구 실험 모델과 프로토타입\n전체 컬렉션을 포함한 디자인 자산의 일부를 확보한다.</p>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/vt_conf_1988death.jpg\" alt=\"1988, 레이 임스의 죽음 이후\"></div>\n<p><strong>1989,</strong> 프랭크 게리 설계의 <strong>Vitra Design Museum</strong> 개관. 곧 독자적 문화 기관으로 자리잡았다.</p>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/vt_conf_museum.jpg\" alt=\"Vitra Design Museum\"></div>\n<p><strong>1991,</strong> 'Citizen Office' 프로젝트. 안토니오 치테리오, 재스퍼 모리슨, 마르턴 반 세베런,\n알베르토 메다, 헬라 용에리위스, 부훌렉 형제와의 협업이 시작된다.</p>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/vt_conf_1990citizen.jpg\" alt=\"Citizen Office\"></div>\n<p><strong>1993,</strong> 자하 하디드가 설계한 소방서가 캠퍼스에 개관 — 그녀의 첫 실현 프로젝트였다.\n안도 다다오의 컨퍼런스 파빌리온도 같은 해 문을 열었다.</p>\n<p><strong>1994,</strong> 본사를 바젤 근처 <strong>비르스펠덴</strong>으로 이전(프랭크 게리 설계).</p>\n<p><strong>2004,</strong> <strong>Vitra Home Collection</strong> 런칭. 2009년 클래식과 컨템포러리를 아우르며 확장된다.</p>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/vt_conf_2009home.jpg\" alt=\"Vitra Home Collection\"></div>\n<p><strong>2010,</strong> 헤르조그 &amp; 드 뫼롱 설계의 <strong>VitraHaus</strong> 건립.</p>\n<p><strong>2013,</strong> 핀란드 가구 회사 <strong>Artek</strong> 인수.</p>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/vt_conf_artek_logo.jpg\" alt=\"Vitra + Artek\"></div>\n<p><strong>2016,</strong> 헤르조그 &amp; 드 뫼롱의 <strong>Schaudepot</strong> 개관.</p>\n\n<hr><h3>② 브랜드의 성격</h3>\n\n<p>비트라의 가장 큰 특징은 <strong>전속 디자이너를 두지 않는다</strong>는 것이다. 내부 디자인 조직 자체가 없다.\n제품마다 그 일을 가장 잘할 수 있는 디자이너를 찾아 맡기고, <strong>디자인에는 손대지 않는 것을 철칙</strong>으로 한다.\n개별 디자이너의 감각과 오리지널리티를 존중한다는 뜻이다.</p>\n\n<p><strong>단기 트렌드를 좇는 제품은 만들지 않는다.</strong> 좋은 디자인·높은 제조 기술·고품질 재료로\n수명이 긴 제품을 만들어 대를 이어 쓰게 하는 것을 가장 큰 목표로 둔다.\n재활용 자재를 쓰고 수리를 지원하며, 2008년 이후 모든 공장 전력을 수력발전으로 공급한다.</p>\n\n<p>오리지널리티에 대한 자부심도 강하다. 허먼밀러가 원조인 임스 부부·조지 넬슨의 가구도\n오히려 '비트라' 하면 떠오를 만큼 적극적으로 알렸고, 허먼밀러가 더는 팔지 않는 제품도 비트라는 계속 만든다.\n디자인 역사에서 중요한 부분이라고 보기 때문이다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/vt_conf_eames_portrait.jpg\" alt=\"Charles & Ray Eames\"></div>\n\n<hr><h3>③ 소파 라인</h3>\n\n<p>오피스 쪽에서는 오픈오피스 안에 '방 안의 방'을 만드는 <strong>Alcove</strong>(2006, 부훌렉 형제)와\n소파 위에서 일하도록 전원·태블릿 거치대를 통합한 <strong>Soft Work</strong>(2018, 바버 &amp; 오스거비)가 대표적이다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/vitra_alcove.jpg\" alt=\"Alcove\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/vitra_softwork.jpg\" alt=\"Soft Work\"></div>\n\n<p>리빙 쪽은 브리지형 알루미늄 다리 위에 볼륨이 떠 있는 <strong>Suita</strong>(2010)와\n넉넉한 플랫폼 좌판의 <strong>Grand Sofà</strong>(2017) — 둘 다 안토니오 치테리오 — 가 축을 이룬다.\n헬라 용에리위스의 <strong>Polder</strong>는 비대칭 좌면과 색·소재 조합으로 비트라의 실험적인 면을 보여준다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/vitra_suita.jpg\" alt=\"Suita\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/vitra_polder.jpg\" alt=\"Polder\"></div>\n\n<p>2024년부터는 사용자가 직접 커버를 벗겨 세탁·교체할 수 있는 <strong>Anagram</strong> 계열을 전개하고,\n2026년에는 컨트랙트용 <strong>Anagram Club</strong>으로 확장했다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/vitra_anagram.jpg\" alt=\"Anagram Sofa\"></div>", "logo": "https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/vitra_logo.svg"}, "saba": {"summary": "1987년 설립된 이탈리아 브랜드. 패브릭과 벨벳에 특화돼 있고 1,000종이 넘는 가죽·패브릭 커스터마이징을 제공한다. 릴렉싱하고 여성적인 컨템퍼러리 감각이 소파 컬렉션에서 가장 잘 드러난다.", "founded": "1987", "hq": "Italy", "signature": "Pixel, New York Suite, Gala, Limes", "source_url": "https://fursys.atlassian.net/wiki/spaces/RD/pages/626605996", "html": "<p><strong>Saba Italia</strong>는 1987년 설립된 이탈리아 가구 브랜드다.\n아이덴티티는 <strong>릴렉싱 · 페미닌 · 컨템퍼러리</strong>로 요약된다.\n앞서 살펴본 카시나(1927)나 B&amp;B Italia(1966)에 비하면 젊은 브랜드지만,\n<strong>패브릭과 벨벳</strong>이라는 분명한 무기를 갖고 자리를 잡았다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/saba_pixel.webp\" alt=\"Pixel\"></div>\n\n<hr><h3>① 브랜드의 성격</h3>\n\n<p>사바가 내세우는 지향점은 두 가지다. 하나는 <strong>훌륭한 품질과 인체공학에 대한 관심</strong>을 바탕으로\n소비자의 요구에 부응하는 것, 다른 하나는 <strong>감성을 자극하는 미학</strong>을 제공하는 것이다.</p>\n\n<p><strong>패브릭과 벨벳에 특화</strong>돼 있고, <strong>1,000종이 넘는 가죽·패브릭</strong>으로 커스터마이징할 수 있다.\n의자·침대·소품까지 다루지만 <strong>브랜드의 정체성이 가장 잘 드러나는 것은 소파 컬렉션</strong>이다.</p>\n\n<p>협업 디자이너는 <strong>세르지오 비체고(Sergio Bicego)</strong>가 중심이다.\nPixel, New York Suite, Land, Limes, Ananta, My Taos, Avant-Après, Essentiel, Rendez-vous, Karma까지\n주력 라인 대부분이 그의 작업이다. 여기에 크리스티나 첼레스티노(Gala), 스튜디오페페(Simposio),\n자넬라토/보르토토(Vela, Vela Piping), 니콜라 파반(Metis, Paso Doble), 주세페 비가노(Up-grade, Livingston)가\n더해지고, 패션 디자이너 <strong>안토니오 마라스</strong>와의 협업(Oltremare)도 있다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/saba_gala.webp\" alt=\"Gala\"></div>\n\n<hr><h3>② 대표 제품</h3>\n\n<p><strong>Pixel</strong>(2010, 세르지오 비체고) — 사바를 대표하는 모듈 소파.\n<strong>사바가 자체 제작한 전용 커넥터</strong>로 등받이·팔걸이·좌판을 분리하고 다시 붙여\n끝없이 새로운 배치를 만들 수 있다. 좌판은 세탁한 거위 깃털과 폴리우레탄 폼, 면 100% 솜쿠션 커버,\n등쿠션은 거위 솜털에 면 100% 커버다. 패브릭 사양 교체와 세탁이 가능하다.\n<em>3모듈 기준 €7,709.</em></p>\n\n<p><strong>New York Suite</strong>(2015, 세르지오 비체고) — 퀼팅 디테일의 전통적 미감과\n슬림한 프레임의 현대적 미감을 겹쳐 놓은 소파. 특화된 퀼트 기술로 커버 교체가 쉽다.\n레트로 무드 덕에 국내에서 <strong>'강민경 소파'</strong>로 알려지며 인지도를 얻었다.\n<em>3인 기준 €6,856.</em></p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/saba_newyorksuite.webp\" alt=\"New York Suite\"></div>\n\n<p><strong>Gala</strong>(2021, 크리스티나 첼레스티노) — 상호작용과 유연함을 보여주는 소파로,\n<strong>1970년대 레트로 퓨처</strong> 감성을 담았다. 앞뒤가 동일한 등판과 두 가지 깊이의 좌판으로\n모듈 구성에 유연함을 줬다. 주거뿐 아니라 로비 같은 공간에도 쓰인다.</p>\n\n<p><strong>Limes</strong> — 베이스 사방에 등판을 붙였다 뗄 수 있는 구조로,\n시대를 앞서 유연성과 기능적 품질을 이야기한 모델이다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/saba_limes.webp\" alt=\"Limes\"></div>\n\n<p><strong>Vela · Vela Piping</strong>(자넬라토/보르토토) — 돛(vela)이 바람에 부푼 형태에서 출발했다.\nPiping 버전은 파이핑 디테일을 더했고 요소가 많아 조합 폭이 넓다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/saba_velapiping.webp\" alt=\"Vela Piping\"></div>\n\n<hr><h3>③ 국내 유통</h3>\n\n<p>국내에는 <strong>보에(BOE)가 독점 유통</strong>한다.\n결이 가까운 브랜드로는 <strong>HAY, &amp;Tradition, Zanotta</strong>가 꼽힌다.</p>", "logo": "https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/saba_logo.svg"}, "bebitalia": {"summary": "1966년 카시나와의 합작 C&B Italia로 출발해 1973년 독립한 이탈리아 하이엔드 브랜드. 목재 대신 스틸 프레임을, 그리고 폴리우레탄 폼 몰딩을 소파에 처음 도입해 업계를 바꿨다. 황금콤파스상을 네 차례 수상했고, 현재 Flos B&B Italia Group 소속이다.", "founded": "1966", "hq": "Novedrate, Como, Italy", "signature": "Camaleonda, Charles, Tufty-Time, Le Bambole, Diesis", "source_url": "https://fursys.atlassian.net/wiki/spaces/RD/pages/626377774", "html": "<p><strong>B&amp;B Italia</strong>는 1966년 <strong>피에로 암브로조 부스넬리(Piero Ambrogio Busnelli)</strong>의\n기업가적 구상에서 출발했다. 처음 이름은 <strong>C&amp;B Italia</strong> — 카시나(Cassina)와 부스넬리(Busnelli)의\n합작이었다. 당시 전통 가구 제조 방식으로 업계를 이끌던 카시나와 손잡고,\n<strong>현대적이고 기술적인 접근으로 업홀스터드 가구의 세계를 흔들었다.</strong></p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/bb_hist_cover.jpg\" alt=\"B&B Italia\"></div>\n\n<hr><h3>① 연혁</h3>\n\n<p><strong>1966,</strong> 피에로 암브로조 부스넬리가 C&amp;B(Cassina &amp; Busnelli) 설립.\n같은 해 아프라 &amp; 토비아 스카르파의 <strong>Coronado</strong>가 나온다. 철제 프레임에\n<strong>냉간 성형 폴리우레탄 폼</strong>이라는 당시로선 혁명적인 기술을 결합한 제안이었고,\n이 기술을 가구 업계에 처음 들여온 것이 B&amp;B Italia다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/bb_coronado.jpg\" alt=\"Coronado, 1966\"></div>\n\n<p><strong>1969,</strong> 가에타노 페세의 <strong>UP 시리즈.</strong> 진공 포장 상자에 담겨\n'여행하기 위해 태어난' 첫 암체어였다. up5_6은 편안한 자궁을 가졌으면서 동시에 갇혀 있는\n여성상의 은유로 읽힌다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/bb_serieup2000.jpg\" alt=\"Serie Up 2000\"></div>\n\n<p><strong>1970-1972,</strong> 마리오 벨리니의 <strong>Le Bambole</strong> 탄생.\n올리비에로 토스카니의 파격적인 광고 캠페인과 함께 화제가 됐고, <strong>1979년 황금콤파스상</strong>을 받았다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/bb_lebambole.jpg\" alt=\"Le Bambole\"></div>\n\n<p><strong>1973,</strong> 부스넬리가 <strong>카시나의 지분을 사들이고 사명을 B&amp;B Italia로 바꾼다.</strong>\n새 본사 사옥은 <strong>렌초 피아노와 리처드 로저스</strong>가 설계했다.</p>\n<p><strong>1975,</strong> 자매 브랜드 <strong>Maxalto</strong> 설립.</p>\n<p><strong>1976,</strong> 뉴욕에 첫 모노브랜드 스토어 개점.</p>\n<p><strong>1978,</strong> B&amp;B Italia 컨트랙트 디비전 설립.</p>\n<p><strong>1979,</strong> 아시아 첫 진출 — B&amp;B Italia Japan 개설.</p>\n<p><strong>1984,</strong> Studio Kairos의 Sisamo 옷장으로 <strong>두 번째 황금콤파스상.</strong></p>\n<p><strong>1989,</strong> 안토니오 치테리오의 Sity 소파로 세 번째 황금콤파스상을 받은 뒤,\n<strong>네 번째는 '이탈리아 디자인 발전에 기여한 공로'로 기업에게 주어진 최초의 수상</strong>이었다.</p>\n<p><strong>1993,</strong> 안토니오 치테리오가 Maxalto의 단독 디자이너 겸 아트 디렉터가 된다.</p>\n<p><strong>1997,</strong> 소파 시스템 <strong>Charles</strong> 출시. B&amp;B Italia 최고의 스테디셀러이자\n전 세계 디자인계의 기준 모델이 됐다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/bb_charles.jpg\" alt=\"Charles, 1997\"></div>\n\n<p><strong>2001,</strong> 직영점과 현지 파트너 단독 매장 중심으로 국제 유통망 재편.</p>\n<p><strong>2005,</strong> 파트리시아 우르키올라의 <strong>Tufty-Time.</strong> 오토만을 기본 단위로 확장하는\n모듈 시스템으로, 커버 탈착이 가능하다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/bb_tuftytime.jpg\" alt=\"Tufty-Time\"></div>\n\n<p><strong>2007,</strong> B&amp;B Italia Outdoor 컬렉션 출범.</p>\n<p><strong>2010,</strong> 폼 성형 부문에 대규모 기술 투자. 같은 해 우르키올라의\n<strong>Bend-Sofa</strong>가 나온다. 3D 모델링과 디지털 리서치에서 출발한 물결 형태다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/bb_bendsofa.jpg\" alt=\"Bend-Sofa\"></div>\n\n<p><strong>2016,</strong> Arclinea 인수. <strong>2018,</strong> Azucena 인수.</p>\n<p><strong>2018,</strong> 12월부터 B&amp;B Italia는 <strong>Flos B&amp;B Italia Group</strong>의 일원이 된다.\nB&amp;B Italia, Flos, Louis Poulsen, Arclinea, Maxalto, Azucena, FENDI Casa, Audo, Lumens를 아우르는\n하이엔드 가구·조명 그룹으로, Investindustrial과 Carlyle이 공동 소유한다.</p>\n<p><strong>2020,</strong> 1970년 마리오 벨리니가 디자인한 <strong>Camaleonda</strong>가 돌아온다.\n90×90cm 좌모듈, 등받이, 팔걸이, 그리고 그것들을 잇는 고리 — 원작의 핵심 요소를 그대로 지켰다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/bb_camaleonda.jpg\" alt=\"Camaleonda\"></div>\n\n<hr><h3>② 기술적으로 무엇이 달랐나</h3>\n\n<p>B&amp;B Italia를 이해하는 핵심은 <strong>기술</strong>이다. 두 가지가 결정적이었다.</p>\n<ul>\n<li>그 시절 흔하던 <strong>목재 프레임 대신 스틸 구조</strong>를 소파에 써서 내구성을 크게 높였다.</li>\n<li><strong>폴리우레탄 폼 몰딩 기술을 쿠션에 처음 적용</strong>해 만들 수 있는 형태의 폭을 넓혔다.</li>\n</ul>\n<p>이 두 가지가 업계에 미친 파급력이 컸다. 1969년에는 리서치 센터를 세워 실험적 제품 연구를 계속했다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/bb_diesis.jpg\" alt=\"Diesis, 1979\"></div>\n\n<p>사업 영역은 <strong>주거 가구 / 공용 공간·호텔·리조트 가구 / 선박 가구</strong>로 나뉘어\n제조와 공정이 분리돼 있을 만큼 체계적이다. 디자인은 물론 기능성과 효율까지 따지는 오늘날의 소비자를\n만족시키는 근거가 여기에 있다.</p>\n\n<hr><h3>③ 브랜드 계열</h3>\n\n<ul>\n<li><strong>Maxalto</strong> — 목제 프레임과 정교한 디테일 기반의 프렌치 클래식 스타일. 1975년 설립, 치테리오가 아트 디렉터.</li>\n<li><strong>B&amp;B Italia Outdoor</strong> — 아웃도어 전문 라인(2007~)</li>\n<li><strong>B&amp;B Italia Projects</strong> — 공용 공간·컨트랙트용</li>\n</ul>\n\n<p>타임리스를 추구하면서도 <strong>가장 동시대적</strong>이라는 평가를 받을 만큼 트렌디한 컬렉션을 꾸준히 낸다.\n핵심 가치는 타임리스 디자인, 창의적 발상과 혁신, 장인 정신이다.</p>", "logo": "https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/bebitalia_logo.svg"}, "moroso": {"summary": "1952년 설립된 이탈리아 브랜드. 새로운 디자이너를 발굴해 내놓는 신제품과, 자연에서 가져온 형태에 화려한 컬러를 얹는 감각으로 알려져 있다. 패브릭 소파에 강점이 있고 디젤과의 협업 라인도 길게 이어진다.", "founded": "1952", "hq": "Cavalicco, Udine, Italy", "signature": "Gentry, Misfits, Do-Lo-Rez, Gogan, Saruyama", "source_url": "https://fursys.atlassian.net/wiki/spaces/RD/pages/626775453", "html": "<p><strong>Moroso</strong>는 1952년 이탈리아 북동부 <strong>우디네(Udine)</strong> 근교 카발리코에서 설립됐다.\n아이덴티티는 <strong>아이코닉 · 컨템퍼러리 · 하이엔드</strong>로 정리되지만,\n실제로 모로소를 다른 이탈리아 브랜드와 구분 짓는 것은 <strong>누구와 일하는가</strong>다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/moroso_gentry.jpg\" alt=\"Gentry\"></div>\n\n<hr><h3>① 브랜드의 성격 — 디자이너 발굴</h3>\n\n<p>모로소를 설명할 때 가장 먼저 나오는 것이 <strong>새로운 디자이너를 발굴해 제품을 낸다</strong>는 점이다.\n국적과 세대를 가리지 않는다.</p>\n\n<ul>\n<li><strong>파트리시아 우르키올라</strong> — 모로소를 대표하는 협업자. Gentry, Bohemian, Gogan, Redondo, Fjord, Lowseat, M.a.s.s.a.s., Tender, Pacific</li>\n<li><strong>론 아라드</strong> — Misfits, Do-Lo-Rez, Victoria and Albert, Double Soft Big Easy</li>\n<li><strong>도시 &amp; 레비엔</strong> — Modernista, My Beautiful Backside, Paper Planes</li>\n<li><strong>프론트(Front)</strong> — Doodle, Pebble Rubble</li>\n<li><strong>토시유키 키타</strong> — Saruyama, Saruyama Island</li>\n<li><strong>세바스찬 헤르크너</strong> — Taru, Noka</li>\n<li><strong>자하 하디드, 다니엘 리베스킨트, 자비에 마리스칼, 알프레도 헤벌리, 고든 기요미에</strong> 등</li>\n</ul>\n\n<p>여기에 패션 브랜드 <strong>디젤과의 장기 협업 라인(Diesel Living with Moroso)</strong>이 더해진다.\nNebula, Cloudscape, High Cloud, Gimme Shelter, D-Uffle, 그리고 글렌 마틴스가 크리에이티브 디렉션을 맡은\nD-Scape까지 이어지고 있다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/moroso_misfits.jpg\" alt=\"Misfits\"></div>\n\n<hr><h3>② 디자인과 제조</h3>\n\n<p>디자인은 <strong>자연에서 영감을 받은 형태</strong>에 <strong>화려한 컬러 팔레트</strong>를 얹는 쪽이다.\n완성도와 마감, 실용적 기능을 함께 충족시키며 <strong>패브릭 소파에 강점</strong>을 둔다.\n겉보기에는 조형적이고 과감하지만 실제로 앉아 보면 매우 편안하다는 평이 따라붙는다.</p>\n\n<p>구조는 대체로 목재 또는 스틸 프레임에 밀도가 다른 폴리우레탄 폼과 폴리에스터 화이버를 조합한다.\nSpring처럼 <strong>식물성 오일 기반 마이크로셀 폼</strong>을 쓰는 제품도 있고,\nLowseat·Rift·Spring 등은 커버를 탈착할 수 있다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/moroso_bohemian.jpg\" alt=\"Bohemian\"></div>\n\n<hr><h3>③ 대표 제품</h3>\n\n<p><strong>Gentry</strong>(2011, 파트리시아 우르키올라) — 미니멀하되 엠보싱 스티치로 개성을 더했다.\n디자이너가 이 소파를 위해 <strong>퀼팅 패브릭을 직접 디자인</strong>했다.\n구스다운 좌쿠션과 강관 프레임 조합으로, 모로소의 얼굴 격인 제품이다.</p>\n\n<p><strong>Misfits</strong>(2007, 론 아라드) — 전부 다른 모듈로 이루어진 시스템.\n빈 공간과 입체적인 디자인, 유동체를 떠올리게 하는 굴곡이 특징이고 색상별 조합이 가능하다.</p>\n\n<p><strong>Do-Lo-Rez</strong>(2008, 론 아라드) — 픽셀처럼 높낮이가 다른 모듈을 조합한다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/moroso_dolorez.jpg\" alt=\"Do-Lo-Rez\"></div>\n\n<p><strong>Double Soft Big Easy</strong>(1991, 론 아라드) — 회전 성형 방식과 폴리에틸렌을 써서\n'볼륨' 자체를 연상시키는 형상을 만들었다. 모로소 초기의 실험을 보여주는 제품이다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/moroso_doublesoftbigeasy.jpg\" alt=\"Double Soft Big Easy\"></div>\n\n<p><strong>Gogan</strong>(2019, 우르키올라) — 물과 시간에 닳은 일본의 돌(護岸, gogan)에서 이름과 형태를 가져왔다.\n누울 수 있을 만큼 부드러운 착좌감이 특징이다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/moroso_gogan.jpg\" alt=\"Gogan\"></div>\n\n<p><strong>Saruyama</strong>(1989, 토시유키 키타) — 독립된 세 개의 성형 요소를 합치면\n하나의 큰 원형 시팅이 된다. 이름은 일본어로 '원숭이 산'이다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/moroso_saruyama.jpg\" alt=\"Saruyama\"></div>\n\n<p><strong>Pebble Rubble</strong>(2022, 프론트) — 조약돌 형태의 요소들을 흩뿌리듯 배치하는 모듈 시스템.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/moroso_pebblerubble.jpg\" alt=\"Pebble Rubble\"></div>", "logo": "https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/moroso_logo.svg"}, "cassina": {"summary": "1927년 메다에서 시작한 이탈리아 하이엔드 브랜드. 1950년대에 이탈리아 산업디자인을 출범시켰고, 르코르뷔지에·리트벨트 같은 거장의 원작을 고증에 근거해 복각하는 'I Maestri' 컬렉션으로 알려져 있다.", "founded": "1927", "hq": "Meda, Italy", "signature": "Maralunga, LC2 · LC3, Soriana, Utrecht, Esosoft", "source_url": "https://fursys.atlassian.net/wiki/spaces/RD/pages/626116347", "html": "<p><strong>Cassina</strong>는 1927년 체사레와 움베르토 카시나 형제가 밀라노 북부 브리안차 지역의\n<strong>메다(Meda)</strong>에 세운 가구 회사다. 처음 이름은 창업주 아버지의 이름을 딴 'Amedeo Cassina'였고,\n1935년 'Figli di Amedeo Cassina'로 바꿨다. 초기에는 커피 테이블을 만드는 목공소였고 디자인도 사내에서 했다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/cassina_hist_hero.jpg\" alt=\"Cassina, Meda\"></div>\n\n<p>카시나의 역사적 성취는 <strong>1950년대에 이탈리아 산업디자인을 출범시켰다</strong>는 데 있다.\n장인 생산에서 대량 생산으로 넘어가는 전환을 주도했고, 그 방식은 기술과 오랜 수공예를 결합하는 것이었다.\n지금도 카시나를 설명하는 두 축은 <strong>리서치와 혁신</strong>, 그리고 <strong>장인 정신</strong>이다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/cassina_hist_timeline1.jpg\" alt=\"Cassina 아카이브\"></div>\n\n<hr><h3>① 연혁</h3>\n\n<p><strong>1927,</strong> 체사레·움베르토 카시나 형제가 메다에서 'Amedeo Cassina' 설립. 커피 테이블 중심의 캐비닛 메이킹.</p>\n<p><strong>1948,</strong> 설계와 생산을 분리하고 <strong>외부 건축가·디자이너와 협업</strong>을 시작한다.\n전후에 <strong>지오 폰티(Gio Ponti)</strong>와 긴밀히 작업하며 미학적 이미지를 갈아엎었다.</p>\n<p><strong>1952,</strong> 컨트랙트 시장에서 첫 대형 수주. 지오 폰티와 함께 이탈리아 대서양 정기선\n<strong>안드레아 도리아호</strong>의 인테리어를 설계했다. 메이드 인 이탈리아 스타일을 미국에 수출한 첫 사례로 기록된다.</p>\n<p><strong>1954,</strong> 이탈리아 디자인의 출발을 알린 <strong>황금콤파스상(Compasso d'Oro)</strong> 1회 시상에서\n카를로 데 카를리의 Model 683 의자로 첫 수상. 같은 시기 이코 파리시, 잔프랑코 프라티니와의 협업이 시작된다.</p>\n<p><strong>1957,</strong> 지오 폰티와의 협업과 카시나 장인들의 실험이 만나 <strong>Superleggera(699)</strong> 의자가 나온다.\n무게 1.7kg. 이탈리아 디자인의 아이콘이 됐다.</p>\n<p><strong>1963,</strong> <strong>비코 마지스트레티</strong>가 합류. Carimate 암체어로 첫 성공을 거둔다.</p>\n<p><strong>1965,</strong> 1920년대 <strong>르코르뷔지에·피에르 잔느레·샤를로트 페리앙</strong>의 모델 생산 개시.\n모더니즘 운동의 가장 중요한 가구들을 컬렉션으로 삼겠다는 선언이었다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/cassina_lc2.jpg\" alt=\"LC2 Fauteuil Grand Confort\"></div>\n\n<p><strong>1966,</strong> 대량 생산으로 넘어가기 위해 <strong>C&amp;B(Cassina &amp; Busnelli)</strong>를 설립한다.\n사출 성형 폴리우레탄 폼 공법을 도입했고, 1968년 아프라 &amp; 토비아 스카르파의 Ciprea 암체어가 카탈로그에 들어온다.\n1969년에는 리서치 센터를 세웠다. <em>C&amp;B는 1973년 부스넬리 쪽으로 넘어가 B&amp;B Italia가 된다.</em></p>\n<p><strong>1968,</strong> 마리오 벨리니가 설계한 밀라노 비아 두리니 쇼룸 개관(약 1,200㎡).\n높이 8m, 지름 20m의 돔이 중심이다. 이후 마지스트레티, 카스틸리오니, 리소니, 우르키올라가 차례로 다시 설계했다.</p>\n<p><strong>1970,</strong> 아프라 &amp; 토비아 스카르파의 <strong>Soriana</strong> 소파·암체어가 황금콤파스상 수상.\n극도로 단순한 구조로 복잡한 형태를 만들어낸 점이 평가받았다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/cassina_soriana.jpg\" alt=\"Soriana\"></div>\n\n<p><strong>1972,</strong> 뉴욕 MoMA의 'Italy: the new domestic landscape' 전. 카시나는 마리오 벨리니의 컨셉카\n<strong>Kar-a-sutra</strong>를 제작했다. 집과 자동차 사이의 물건으로, 이후 미니밴(MPV)의 선구가 됐다.</p>\n<p><strong>1973,</strong> <strong>'I Maestri' 컬렉션 출범.</strong> 리트벨트와 매킨토시의 작업이 들어오면서\n20세기 가구의 원형을 고증에 근거해 복각하는 카시나의 대표 사업이 시작된다.\n유족·재단과 협업해 역사적 정확성을 확보하는 방식이다.</p>\n<p><strong>1973,</strong> 비코 마지스트레티의 <strong>Maralunga</strong> 출시. 등받이에 심은\n<strong>자전거 체인</strong>으로 헤드 각도를 바꾸는 구조가 결정적이었다. 1979년 황금콤파스상.\n전 세계에서 가장 많이 모방된 소파 중 하나다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/cassina_maralunga.jpg\" alt=\"Maralunga\"></div>\n\n<p><strong>1973,</strong> 동시에 급진적 디자인도 카탈로그에 들어온다. 파올로 데가넬로/아르키줌의 <strong>AEO</strong> 암체어가 그 예다.</p>\n<p><strong>1977,</strong> 마리오 벨리니의 <strong>Cab</strong> 의자. 강관 골격에 가죽을 '피부처럼' 씌운 구조로,\n뉴욕 MoMA 영구 소장품이 됐다.</p>\n<p><strong>1980,</strong> 토시유키 키타의 <strong>Wink</strong> 암체어와 가에타노 페세의\n<strong>Tramonto a New York</strong>. 후자는 팔걸이가 뉴욕 마천루, 등받이가 지는 해다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/cassina_tramonto.jpg\" alt=\"Tramonto a New York\"></div>\n\n<p><strong>1987,</strong> 가에타노 페세가 리서치 센터에서 진행한 실험이 <strong>I Feltri</strong> 암체어로 이어진다.\n열경화 수지를 머금은 펠트 양모로 가구를 만드는 공법을 특허로 등록했다.</p>\n<p><strong>1991,</strong> <strong>기업으로서 황금콤파스상 수상.</strong> 혁신적 역할과 국제적 접근, 그리고\n이탈리아 디자인의 위상을 끌어올린 공로가 사유였다.</p>\n<p><strong>1996,</strong> <strong>피에로 리소니</strong>의 <strong>Met</strong> 소파가 90년대의 상징이 된다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/cassina_met.jpg\" alt=\"Met\"></div>\n\n<p><strong>1998,</strong> 필립 스탁과의 협업에서 <strong>L.W.S.(Lazy Working Sofa)</strong>가 나온다.\n전원을 내장한 멀티펑션 아일랜드로, 소파에서 일하는 방식을 앞서 제안했다.</p>\n<p><strong>2004,</strong> <strong>샤를로트 페리앙</strong>이 I Maestri에 편입된다. 르코르뷔지에·잔느레와 공동 작업한 것 외에\n평생 독자적으로 만든 작업들이 재조명됐다.</p>\n<p><strong>2006,</strong> 르코르뷔지에가 남프랑스 카프마르탱에 지은 오두막 <strong>Cabanon</strong>(1952)의 내부를 재현.\n밀라노 트리엔날레와 뉴욕 MoMA 등에서 전시됐다.</p>\n<p><strong>2007,</strong> 필립 스탁의 <strong>Privé</strong> 컬렉션. 카피토네(capitonné) 터프팅 패턴이 국제 특허가 됐다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/cassina_prive.jpg\" alt=\"Privé\"></div>\n\n<p><strong>2008,</strong> 창립 80주년을 맞아 밀라노 트리엔날레에서 'Made in Cassina' 전시와 책 출간.\n같은 해 <strong>프랑코 알비니</strong>가 I Maestri에 합류한다.</p>\n<p><strong>2011,</strong> 알비니가 1940년 설계한 책장 <strong>Il Veliero</strong>를 되살린다. 단 하나 남아 있던 원본을\n전문가 팀과의 연구로 현대 기술을 써서 복원했다.</p>\n<p><strong>2013,</strong> <strong>Simon International</strong> 인수. 창업자 디노 가비나와 체사레 카시나는\n1950~60년대 이탈리아 가구 디자인의 출현을 함께 이끈 인물이다. 카를로 스카르파, 카즈히데 타카하마의 작업이 카탈로그에 들어왔다.\n같은 해 <strong>칼 라거펠트</strong>와 협업.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/cassina_utrecht.jpg\" alt=\"Utrecht\"></div>\n\n<hr><h3>② 브랜드의 성격</h3>\n\n<p>아이덴티티는 <strong>하이엔드 · 클래식 · 독창성 · 우아함</strong>으로 요약된다.\n카시나를 다른 이탈리아 브랜드와 구분 짓는 것은 <strong>수공예 공방과 대기업 공장 사이의 정체성</strong>이다.\n수준 높은 수공예를 산업화하는 데 성공하면서도, 급진적인 디자인을 동시에 받아들였다.</p>\n\n<p>2차 대전 직후인 1950년 선박 산업 부흥기에 <strong>선박용 가구를 납품</strong>하며 회사가 크게 성장했다는 점도\n카시나를 이해하는 데 중요하다. 컨트랙트 시장에서의 경험이 이후 대량 생산 체계로 이어졌다.</p>\n\n<p>제품은 다양한 가죽·패브릭으로 커스터마이징할 수 있고, 최근에는 지속가능성 쪽 작업이 늘었다.\nSoriana는 2021년 Cassina LAB 프로젝트의 일환으로 식물 유래 바이오폼과 재활용 화이버로 자재를 바꿨고,\n<strong>Esosoft</strong>(2022, 안토니오 치테리오) 같은 신작도 같은 방향에 있다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/cassina_esosoft.jpg\" alt=\"Esosoft\"></div>\n\n<hr><h3>③ 라이브러리에서 볼 때 주의할 점</h3>\n\n<p>카시나 제품 페이지에 표기되는 연도는 <strong>카시나 에디션 출시 연도</strong>다. 거장 복각품의 경우\n원작 디자인 연도와 크게 다르다.</p>\n<ul>\n<li><strong>LC2 · LC3</strong> — 1928년 원작 / 1965년 카시나 생산</li>\n<li><strong>Utrecht</strong> — 1935년 리트벨트 원작 / 1988년 카시나 생산</li>\n<li><strong>Lady</strong> — 1951년 마르코 자누소 원작 / 2016년 표기</li>\n<li><strong>Cornaro</strong> — 1973년 카를로 스카르파 원작 / 2024년 복각</li>\n<li><strong>Refolo</strong> — 1953년 샤를로트 페리앙 원작 / 2004년 편입</li>\n</ul>\n<p>라이브러리의 연도 필터를 쓸 때는 이 점을 감안해야 한다. 알려진 원작 연도는 각 제품 설명에 병기했다.</p>", "logo": "https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/cassina_logo.svg"}, "ligneroset": {"summary": "1860년 양산용 지팡이 공장으로 시작한 프랑스 브랜드. 양산 수요가 사라지자 의자 프레임으로 업을 바꿨고, 1973년 미셸 뒤카로이의 Togo와 함께 'Ligne Roset'이라는 브랜드명을 갖게 됐다.", "founded": "1860", "hq": "Briord, France", "signature": "Togo, Ploum, Ruché, Prado, Pumpkin", "source_url": "https://fursys.atlassian.net/wiki/spaces/RD/pages/632947019", "html": "<p><strong>Ligne Roset</strong>의 출발은 가구가 아니었다. 1860년, 열아홉 살의\n<strong>앙투안 로제(Antoine Roset, 1841-1893)</strong>가 오트사부아 크뤼제유 출신의 웨이터로 일하다가\n뷔제(Bugey)의 너도밤나무 숲에 끌려 퐁댕 근처 우시아에 정착했고, 거기서\n<strong>양산용 지팡이(canes for parasols)를 만드는 작은 공장</strong>을 세운 것이 시작이다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/lr_hist_family.png\" alt=\"Roset 가족, 초창기 공장\"></div>\n\n<p>1892년에는 몽타니외(Ain)에 부지를 사들여 브리바즈 강에 물레방아를 걸고 목재를 켰다.\n직원이 서른 명쯤 되던 때였다. 그런데 19세기 말 여성들이 양산을 들지 않게 되면서 수요가 사라졌고,\n앙투안 로제는 <strong>목선반을 의자 다리와 프레임 제작으로 돌렸다.</strong> 곧 의자를 통째로 만들기 시작한다.\n브랜드의 운명이 결정된 순간이었다.</p>\n\n<p>1893년 그가 죽은 뒤 아내 마리빅토린(1854-1923)이 사업을 이어받았고, 1910년대에 아들\n에밀 로제(1882-1946)에게 넘겼다. 1930년대까지 'Etablissements Veuve A. Roset'은 등받이 살대 의자와\n등나무 의자를 만들었고, <strong>1936년 첫 업홀스터드 시트</strong>를 내놓는다. 주로 가죽이었다.</p>\n\n<hr><h3>① 연혁</h3>\n\n<p><strong>1860,</strong> 앙투안 로제, 우시아에 양산용 지팡이 공장 설립.</p>\n<p><strong>1892,</strong> 몽타니외로 이전. 브리바즈 강의 물레방아로 목재 가공.</p>\n<p><strong>1890년대 말,</strong> 양산 수요 붕괴 → <strong>의자 다리·프레임으로 전환</strong>, 곧 완제품 의자 생산.</p>\n<p><strong>1936,</strong> 첫 업홀스터드 시트 생산(주로 가죽).</p>\n<p><strong>1946,</strong> 에밀 로제가 교통사고로 사망. 아들 <strong>장 로제(Jean Roset, 1920-1999)</strong>가 이어받는다.</p>\n<p><strong>1950년대,</strong> 전후 재건 국면에서 <strong>컨트랙트 가구로 사업을 튼다.</strong> 공공 조달의 황금기였다.\n학교·고등학교·대학·병원·요양원에 스칸디나비아풍 모던 가구를 납품했다. 주재료는 값싸고 가공이 쉬운 너도밤나무였지만\n마호가니·로즈우드 같은 고급 목재도 썼고, 금속과 플라스틱을 결합하는 실험도 했다.\n파리·그르노블·샹베리 대학, 리옹 INSA 강의동, 파리 근교 앙토니 캠퍼스를 채웠다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/lr_hist_1950a.png\" alt=\"1950년대 컨트랙트 납품\"></div>\n\n<p><strong>1956,</strong> 주식회사로 전환. <strong>1965년 Roset 컴퍼니가 사실상 출범한다.</strong></p>\n<p><strong>1967,</strong> 독일에 첫 해외 거점. 수출이 세 번째 본능이 된다. 현재 해외 매출이 전체의 <strong>60%</strong>다.</p>\n<p><strong>1970년대,</strong> 장 로제는 70년대의 창작 폭발을 회사를 되살릴 기회로 봤고,\n사업의 방향을 <strong>가정용 시장</strong>으로 되돌린다. 인테리어 건축가·디자이너와 일하기 시작했다.\n그중 한 사람이 <strong>미셸 뒤카로이(Michel Ducaroy)</strong>였다.</p>\n<p><strong>1973,</strong> <strong>Togo 출시.</strong> 프레임 없이 폴리에테르 폼만으로 만든 로우 소파로,\n지금까지 <strong>120만 개 이상</strong> 팔렸다. 만화가 클레르 브레테셰가 'Les Frustrés' 연작에서 Togo에 늘어진\n인물들을 그렸고, 자크 세겔라가 광고 캠페인을 맡았다. 로제는 이 시기 <strong>비관습적이고 심지어 전복적인 브랜드</strong>로\n인식됐다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/lr_hist_togo.png\" alt=\"Togo, 1973\"></div>\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/lr_togo.jpg\" alt=\"Togo\"></div>\n\n<p><strong>1973,</strong> 같은 해 <strong>'Ligne Roset'이 공식 브랜드명이 된다.</strong>\n자사 이름으로 유통망을 갖겠다는 것 — 당시 가구 시장에서는 파격이었다 — 이 두 번째 통찰이었고,\n첫 Ligne Roset 매장이 이 해부터 열린다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/lr_hist_1950b.png\" alt=\"Ligne Roset 매장\"></div>\n\n<p><strong>1990년대 이후,</strong> 150년을 지나며 브랜드는 <strong>모던 럭셔리의 상징</strong>이 됐다.\n현재 <strong>전 세계 70명이 넘는 디자이너</strong>와 협업한다. 갓 학교를 나온 신인부터 세계적 거장까지 가리지 않는다.</p>\n\n<hr><h3>② 브랜드의 성격</h3>\n\n<p>아이덴티티는 <strong>창의력 · 과감함 · 컨템퍼러리</strong>다.\n미셸 로제는 \"리네로제의 의자나 가구는 언제나 목재와 폼 이상의 것\"이라고 말한다.</p>\n\n<p><strong>프랑스 디자이너가 세계에 이름을 알리는 발판</strong> 역할을 해 왔고,\n새로운 재료와 제작 방법에 대한 지원을 아끼지 않는다. 부훌렉 형제(Facett)부터\n<strong>피에르 폴랭</strong>까지 — 폴랭은 말년의 작업을 이 프랑스 회사에 맡겼고,\nCM 141 데스크와 TV 체어를 복각했으며, 1971년 조르주 퐁피두 대통령 시절\n<strong>엘리제궁을 위해 디자인했던 Pumpkin</strong>을 처음으로 일반 시장용으로 생산하게 했다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/lr_pumpkin.jpg\" alt=\"Pumpkin\"></div>\n\n<p>생산은 여전히 <strong>뷔제 지역에 남아 있다.</strong> 앵(Ain)·론(Rhône)·이제르(Isère)의 다섯 개 공장에서\n가구를 만들고, 시팅 컬렉션은 오베르뉴론알프 지역의 자체 공방에서 제작한다.\n에디터이자 제조사이자 유통사라는 것이 브랜드가 내세우는 정체성이다.</p>\n\n<hr><h3>③ 대표 제품</h3>\n\n<p><strong>Ploum</strong>(2017, 로낭 &amp; 에르완 부훌렉) — 신축성 저지로 감싼 소파.\n좌우 등좌판 높이를 의도적으로 비대칭으로 두고 가운데로 모이는 각도를 줘 대화를 유도한다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/lr_ploum.jpg\" alt=\"Ploum\"></div>\n\n<p><strong>Ruché</strong>(2010, 잉가 셈페) — 제품명은 주름을 잡는 봉제 방식을 뜻한다.\n목재 프레임 위에 누빔 매트리스를 얹은 형태로, 하이백·로우백과 팔걸이 유무를 고를 수 있다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/lr_ruche.jpg\" alt=\"Ruché\"></div>\n\n<p><strong>Prado</strong>(2019, 크리스티안 베르너) — 등쿠션을 원하는 위치와 방향으로 옮겨\n소파 전체 면적을 쓰게 한 구조. 쿠션에 무게감과 미끄럼 방지 기능을 넣었다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/lr_prado.jpg\" alt=\"Prado\"></div>\n\n<p><strong>Asmara</strong>(1966, 베르나르 고뱅) — 모듈 하나가 10kg 이하인 전체 폼 구조.\n줄지어 앉는 대신 모여서 늘어지도록 만든 소파다.</p>\n\n<div class=\"bd-img\"><img src=\"https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/lr_asmara.jpg\" alt=\"Asmara\"></div>", "logo": "https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/ligneroset_logo.png"}};

ps://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/andtradition_logo.svg", "homepage": "https://www.andtradition.com/", "name": "&Tradition"}, "bolia": {"logo": "https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/bolia_logo.svg", "homepage": "https://www.bolia.com/", "name": "Bolia"}, "zanotta": {"logo": "https://raw.githubusercontent.com/jaeyoungkim-jay/furniture-library-images/main/sofa/zanotta_logo.svg", "homepage": "https://www.zanotta.com/", "name": "Zanotta"}};

  async function copyImage(dataUri, btn) {
    if (!dataUri) return;
    try {
      const res = await fetch(dataUri);
      const blob = await res.blob();
      await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
      btn.classList.add("copied");
      setTimeout(() => btn.classList.remove("copied"), 1200);
    } catch (e) {
      console.warn("copy failed", e);
    }
  }

    const wrap = document.getElementById("catList");
    wrap.innerHTML = "";
    document.getElementById("catAllBtn").classList.toggle("on", state.cat === "all");
    document.getElementById("cnt-cat-all").textContent = DATA.filter(p => matchFilters(p, { cat: "all" })).length;
    CATEGORIES.forEach(cat => {
      const cnt = DATA.filter(p => matchFilters(p, { cat: cat })).length;
      const btn = document.createElement("button");
      btn.className = "fb" + (state.cat === cat ? " on" : "");
      btn.innerHTML = cat + ` <span class="cnt">${cnt}</span>`;
      btn.onclick = () => { state.cat = state.cat === cat ? "all" : cat; refresh(); };
      wrap.appendChild(btn);
    });
  }

  function renderTypeList() {
    const wrap = document.getElementById("typeList");
    wrap.innerHTML = "";
    document.getElementById("typeAllBtn").classList.toggle("on", state.type === "all");
    document.getElementById("cnt-type-all").textContent = DATA.filter(p => matchFilters(p, { type: "all" })).length;
    TYPES.forEach(t => {
      const cnt = DATA.filter(p => matchFilters(p, { type: t })).length;
      const btn = document.createElement("button");
      btn.className = "fb" + (state.type === t ? " on" : "");
      btn.innerHTML = t + ` <span class="cnt">${cnt}</span>`;
      btn.onclick = () => { state.type = state.type === t ? "all" : t; refresh(); };
      wrap.appendChild(btn);
    });
  }

  function renderConfigList() {
    const wrap = document.getElementById("configList");
    wrap.innerHTML = "";
    document.getElementById("configAllBtn").classList.toggle("on", state.config === "all");
    document.getElementById("cnt-config-all").textContent = DATA.filter(p => matchFilters(p, { config: "all" })).length;
    CONFIGS.forEach(c => {
      const cnt = DATA.filter(p => matchFilters(p, { config: c })).length;
      const btn = document.createElement("button");
      btn.className = "fb" + (state.config === c ? " on" : "");
      btn.innerHTML = c + ` <span class="cnt">${cnt}</span>`;
      btn.onclick = () => { state.config = state.config === c ? "all" : c; refresh(); };
      wrap.appendChild(btn);
    });
  }

  function renderBrandList() {
    const wrap = document.getElementById("brandList");
    wrap.innerHTML = "";
    ["north-america", "europe", "asia", "oceania"].forEach(cont => {
      const brandsInCont = BRANDS.filter(b => b[2] === cont);
      if (!brandsInCont.length) return;

      const isOpen = expanded.has(cont);
      const header = document.createElement("button");
      header.className = "fb-cont" + (state.brand !== "all" && state.cont === cont ? " on" : "");
      const contCnt = DATA.filter(p => matchFilters(p, { cont: cont, brand: "all" })).length;
      header.innerHTML = `<span class="chev">${isOpen ? "&#9662;" : "&#9656;"}</span><span>${contLabel[cont]}</span><span class="cnt">${contCnt}</span>`;
      header.onclick = () => {
        if (isOpen) expanded.delete(cont); else expanded.add(cont);
        renderBrandList();
      };
      wrap.appendChild(header);
      if (!isOpen) return;

      brandsInCont.forEach(b => {
        const btn = document.createElement("button");
        btn.className = "fb fb-sub" + (state.brand === b[0] ? " on" : "");
        const cnt = DATA.filter(p => matchFilters(p, { brand: b[0], cont: "all" })).length;
        btn.innerHTML = b[1] + ` <span class="cnt">${cnt}</span>`;
        btn.onclick = () => {
          if (state.brand === b[0]) { state.brand = "all"; }
          else { state.brand = b[0]; state.cont = cont; }
          refresh();
        };
        wrap.appendChild(btn);
      });
    });
  }

  function renderBrandInfo() {
    const wrap = document.getElementById("brandInfoWrap");
    const misc = BRAND_MISC[state.brand];
    if (state.brand === "all" || !misc) {
      wrap.innerHTML = "";
      if (brandDocOpen) closeBrandDoc(false);
      return;
    }
    const info = BRAND_HISTORY[state.brand];
    const meta = BRANDS.find(b => b[0] === state.brand);
    const logoHtml = misc.logo ? `<img src="${misc.logo}" alt="">` : "";
    if (!info) {
      const homeBtn = misc.homepage
        ? `<a class="bi-home-btn" href="${misc.homepage}" target="_blank" rel="noopener">${misc.name} Homepage &#8599;</a>`
        : "";
      wrap.innerHTML = `
        <div class="brand-info">
          <div class="bi-logo-row">
            <div class="bi-logo-wrap">${logoHtml}</div>
            ${homeBtn}
          </div>
        </div>`;
      if (brandDocOpen) closeBrandDoc(false);
      return;
    }
    const homeBtn = misc.homepage
      ? `<a class="bi-home-btn" href="${misc.homepage}" target="_blank" rel="noopener">공식 홈페이지 &#8599;</a>`
      : "";
    wrap.innerHTML = `
      <div class="brand-info">
        <div class="bi-logo-row">
          <div class="bi-logo-wrap">${logoHtml}</div>
          ${homeBtn}
        </div>
        <div class="bi-body">
          <p class="bi-name">${meta ? meta[1] : ""}</p>
          <p class="bi-summary">${info.summary || ""}</p>
          <div class="bi-facts">
            ${info.founded ? `<div class="bi-fact"><b>Founded</b>${info.founded}</div>` : ""}
            ${info.hq ? `<div class="bi-fact"><b>HQ</b>${info.hq}</div>` : ""}
            ${info.signature ? `<div class="bi-fact"><b>Signature</b>${info.signature}</div>` : ""}
          </div>
          <div class="bi-actions">
            <button class="bi-detail-btn" onclick="openBrandDoc()">브랜드 히스토리 보기</button>
            ${info.source_url ? `<a class="bi-source-link" href="${info.source_url}" target="_blank" rel="noopener">원본 문서${info.source_url.includes("atlassian.net") ? " (Confluence)" : ""}</a>` : ""}
          </div>
        </div>
      </div>`;
  }

  function renderBrandDoc() {
    const info = BRAND_HISTORY[state.brand];
    if (!info) { closeBrandDoc(false); return; }
    document.getElementById("brandDocView").innerHTML = `
      <div class="brand-doc">
        <div class="brand-doc-hdr">
          <button class="brand-doc-back" onclick="closeBrandDoc()">&larr; 목록으로</button>
        </div>
        <div class="brand-doc-body">${info.html}</div>
      </div>`;
  }

  function openBrandDoc(record) {
    brandDocOpen = true;
    renderBrandDoc();
    document.getElementById("mainGridView").style.display = "none";
    document.getElementById("brandDocView").style.display = "block";
    if (record !== false) pushNav({ type: "branddoc", brand: state.brand });
    updateNavButtons();
  }

  function closeBrandDoc(record) {
    brandDocOpen = false;
    document.getElementById("mainGridView").style.display = "";
    document.getElementById("brandDocView").style.display = "none";
    if (record !== false) pushNav({ type: "home" });
    updateNavButtons();
  }

  function matchFilters(p, overrides) {
    const s = Object.assign({}, state, overrides || {});
    if (s.cont && s.cont !== "all" && p.continent !== s.cont) return false;
    if (s.cat && s.cat !== "all" && p.category !== s.cat) return false;
    if (s.type && s.type !== "all" && p.type !== s.type) return false;
    if (s.config && s.config !== "all" && p.config !== s.config) return false;
    if (s.brand && s.brand !== "all" && p.brand_id !== s.brand) return false;
    if (s.year && s.year !== "all" && p.year_bucket !== s.year) return false;
    if (s.q) {
      const q = s.q.toLowerCase();
      if (!(p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || (p.desc || "").toLowerCase().includes(q))) return false;
    }
    return true;
  }

  function renderGrid() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    const list = DATA.filter(p => matchFilters(p));
    document.getElementById("gridMeta").textContent = list.length + "개 제품";
    if (list.length === 0) {
      grid.innerHTML = '<div class="state"><div class="ico">&#129681;</div><p>조건에 맞는 제품이 없습니다.</p></div>';
      return;
    }
    list.forEach(p => {
      const card = document.createElement("div");
      card.className = "card" + (selected === p ? " sel" : "");
      const logoHtml = p.logo
        ? `<div class="logochip" data-brand="${p.brand_id}"><img src="${p.logo}" alt="${p.brand}"></div>`
        : `<div class="logochip textonly">${p.brand}</div>`;
      card.innerHTML = `
        <div class="imgwrap">
          <img class="pimg" src="${(p.images[0] || "")}" alt="${p.name}" loading="lazy" onerror="this.style.opacity=0">
          ${logoHtml}
          <button class="copy-btn" title="이미지 복사">${COPY_ICON}</button>
        </div>
        <div class="body">
          <p class="pname">${p.name}</p>
          <p class="brandname">${p.brand}</p>
          <div class="tags">
            <span class="tag cont-${p.continent}">${contLabel[p.continent]}</span>
            ${p.category ? `<span class="tag">${p.category}</span>` : ""}
            ${p.type ? `<span class="tag">${p.type}</span>` : ""}
            ${p.year ? `<span class="tag">${p.year}</span>` : ""}
          </div>
          <span class="price">${p.price || ""}</span>
        </div>`;
      card.querySelector(".copy-btn").addEventListener("click", (e) => { e.stopPropagation(); copyImage((p.images[0] || ""), e.currentTarget); });
      const logoChip = card.querySelector(".logochip");
      if (logoChip) logoChip.addEventListener("click", (e) => { e.stopPropagation(); filterByBrand(p); });
      card.addEventListener("click", () => selectCard(p));
      grid.appendChild(card);
    });
  }

  function filterByBrand(p) {
    state.brand = p.brand_id;
    state.cont = p.continent;
    closeDetail(false);
    refresh();
  }

  function selectCard(p, record) {
    selected = p;
    detIndex = 0;
    closeSidebar();
    document.getElementById("detail").classList.remove("hide");
    document.getElementById("detEmpty").style.display = "none";
    const filled = document.getElementById("detFilled");
    filled.style.display = "flex";
    document.getElementById("dImg").src = (p.images[0] || "");
    document.getElementById("dBrand").textContent = p.brand;
    const logoEl = document.getElementById("dLogo");
    if (p.logo) { logoEl.src = p.logo; logoEl.dataset.brand = p.brand_id; logoEl.style.display = "block"; } else { logoEl.style.display = "none"; }
    document.getElementById("dBrandRow").onclick = () => filterByBrand(p);
    document.getElementById("dName").textContent = p.name;
    document.getElementById("dDesc").textContent = p.desc;
    document.getElementById("dPriceRow").style.display = p.price ? "" : "none";
    document.getElementById("dPrice").textContent = p.price || "";
    document.getElementById("dYear").textContent = p.year || "미상";
    document.getElementById("dCategory").textContent = p.category || "—";
    document.getElementById("dType").textContent = p.type || "—";
    document.getElementById("dMaterial").textContent = p.material || "—";
    document.getElementById("dConfig").textContent = p.config || "—";
    document.getElementById("dDesigner").textContent = p.designer || "—";
    document.getElementById("dLink").href = p.url;
    renderDots();
    renderGrid();
    if (record !== false) pushNav({ type: "detail", product: p });
    updateNavButtons();
  }

  function closeDetail(record) {
    selected = null;
    document.getElementById("detail").classList.add("hide");
    renderGrid();
    if (record !== false) pushNav({ type: "home" });
    updateNavButtons();
  }

  function pushNav(entry) {
    const top = navStack[navIndex];
    if (top && top.type === "home" && entry.type === "home") { updateNavButtons(); return; }
    navStack = navStack.slice(0, navIndex + 1);
    navStack.push(entry);
    navIndex = navStack.length - 1;
    updateNavButtons();
  }

  function updateNavButtons() {
    document.getElementById("btnBack").disabled = navIndex <= 0;
    document.getElementById("btnForward").disabled = navIndex >= navStack.length - 1;
  }

  function applyNavEntry(entry) {
    if (entry.type === "home") {
      if (brandDocOpen) closeBrandDoc(false);
      if (selected) closeDetail(false);
    } else if (entry.type === "detail") {
      if (brandDocOpen) closeBrandDoc(false);
      selectCard(entry.product, false);
    } else if (entry.type === "branddoc") {
      if (selected) closeDetail(false);
      state.brand = entry.brand;
      refresh();
      openBrandDoc(false);
    }
    updateNavButtons();
  }

  function goBack() {
    if (navIndex > 0) { navIndex--; applyNavEntry(navStack[navIndex]); }
  }

  function goForward() {
    if (navIndex < navStack.length - 1) { navIndex++; applyNavEntry(navStack[navIndex]); }
  }

  function goHome() {
    state = { cont: "all", cat: "all", type: "all", brand: "all", year: "all", q: "" };
    document.getElementById("searchInp").value = "";
    if (brandDocOpen) closeBrandDoc(false);
    if (selected) closeDetail(false);
    refresh();
    pushNav({ type: "home" });
  }

  function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("sidebarBackdrop").classList.toggle("show");
  }
  function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarBackdrop").classList.remove("show");
  }
  document.getElementById("sidebar").addEventListener("click", (e) => {
    if (e.target.closest(".fb") && window.innerWidth <= 860) closeSidebar();
  });

  function refresh() {
    document.getElementById("brandAllBtn").classList.toggle("on", state.cont === "all" && state.brand === "all");
    renderYearList();
    renderCatList();
    renderTypeList();
    renderConfigList();
    renderBrandList();
    renderBrandInfo();
    renderGrid();
  }

  document.getElementById("brandAllBtn").addEventListener("click", () => {
    state.cont = "all"; state.brand = "all"; refresh();
  });

  document.getElementById("typeAllBtn").addEventListener("click", () => {
    state.type = "all"; refresh();
  });

  document.getElementById("catAllBtn").addEventListener("click", () => {
    state.cat = "all"; refresh();
  });

  document.getElementById("configAllBtn").addEventListener("click", () => {
    state.config = "all"; refresh();
  });

  document.getElementById("searchInp").addEventListener("input", (e) => {
    state.q = e.target.value;
    renderGrid();
  });

  refresh();
</script>
