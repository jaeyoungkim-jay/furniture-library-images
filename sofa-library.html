    };
    if (!yearListOpen) return;
    YEAR_BUCKETS.forEach(yb => {
      const cnt = DATA.filter(p => matchFilters(p, { year: yb.key })).length;
      if (!cnt) return;
      const btn = document.createElement("button");
      btn.className = "fb fb-sub" + (state.year === yb.key ? " on" : "");
      btn.innerHTML = yb.label + ` <span class="cnt">${cnt}</span>`;
      btn.onclick = () => { state.year = state.year === yb.key ? "all" : yb.key; refresh(); };
      wrap.appendChild(btn);
    });
  }

  function renderCatList() {
    const wrap = document.getElementById("catList");
    wrap.innerHTML = "";
    document.getElementById("catAllBtn").classList.toggle("on", state.cat === "all");
    document.getElementById("cnt-cat-all").textContent = DATA.filter(p => matchFilters(p, { cat: "all" })).length;
    CATEGORIES.forEach(cat => {
      const cnt = DATA.filter(p => matchFilters(p, { cat: cat })).length;
      const btn = document.createElement("button");
      btn.className = "fb" + (state.cat === cat ? " on" : "");
      btn.innerHTML = cat + ` <span class="cnt">${cnt}</span>`;
      btn.onclick = () => { state.cat = state.cat === cat ? "all" : cat; refresh(); };
      wrap.appendChild(btn);
    });
  }

  function renderTypeList() {
    const wrap = document.getElementById("typeList");
    wrap.innerHTML = "";
    document.getElementById("typeAllBtn").classList.toggle("on", state.type === "all");
    document.getElementById("cnt-type-all").textContent = DATA.filter(p => matchFilters(p, { type: "all" })).length;
    TYPES.forEach(t => {
      const cnt = DATA.filter(p => matchFilters(p, { type: t })).length;
      const btn = document.createElement("button");
      btn.className = "fb" + (state.type === t ? " on" : "");
      btn.innerHTML = t + ` <span class="cnt">${cnt}</span>`;
      btn.onclick = () => { state.type = state.type === t ? "all" : t; refresh(); };
      wrap.appendChild(btn);
    });
  }

  function renderConfigList() {
    const wrap = document.getElementById("configList");
    wrap.innerHTML = "";
    document.getElementById("configAllBtn").classList.toggle("on", state.config === "all");
    document.getElementById("cnt-config-all").textContent = DATA.filter(p => matchFilters(p, { config: "all" })).length;
    CONFIGS.forEach(c => {
      const cnt = DATA.filter(p => matchFilters(p, { config: c })).length;
      const btn = document.createElement("button");
      btn.className = "fb" + (state.config === c ? " on" : "");
      btn.innerHTML = c + ` <span class="cnt">${cnt}</span>`;
      btn.onclick = () => { state.config = state.config === c ? "all" : c; refresh(); };
      wrap.appendChild(btn);
    });
  }

  function renderBrandList() {
    const wrap = document.getElementById("brandList");
    wrap.innerHTML = "";
    ["north-america", "europe", "asia", "oceania"].forEach(cont => {
      const brandsInCont = BRANDS.filter(b => b[2] === cont);
      if (!brandsInCont.length) return;

      const isOpen = expanded.has(cont);
      const header = document.createElement("button");
      header.className = "fb-cont" + (state.brand !== "all" && state.cont === cont ? " on" : "");
      const contCnt = DATA.filter(p => matchFilters(p, { cont: cont, brand: "all" })).length;
      header.innerHTML = `<span class="chev">${isOpen ? "&#9662;" : "&#9656;"}</span><span>${contLabel[cont]}</span><span class="cnt">${contCnt}</span>`;
      header.onclick = () => {
        if (isOpen) expanded.delete(cont); else expanded.add(cont);
        renderBrandList();
      };
      wrap.appendChild(header);
      if (!isOpen) return;

      brandsInCont.forEach(b => {
        const btn = document.createElement("button");
        btn.className = "fb fb-sub" + (state.brand === b[0] ? " on" : "");
        const cnt = DATA.filter(p => matchFilters(p, { brand: b[0], cont: "all" })).length;
        btn.innerHTML = b[1] + ` <span class="cnt">${cnt}</span>`;
        btn.onclick = () => {
          if (state.brand === b[0]) { state.brand = "all"; }
          else { state.brand = b[0]; state.cont = cont; }
          refresh();
        };
        wrap.appendChild(btn);
      });
    });
  }

  function renderBrandInfo() {
    const wrap = document.getElementById("brandInfoWrap");
    const misc = BRAND_MISC[state.brand];
    if (state.brand === "all" || !misc) {
      wrap.innerHTML = "";
      if (brandDocOpen) closeBrandDoc(false);
      return;
    }
    const info = BRAND_HISTORY[state.brand];
    const meta = BRANDS.find(b => b[0] === state.brand);
    const logoHtml = misc.logo ? `<img src="${misc.logo}" alt="">` : "";
    if (!info) {
      const homeBtn = misc.homepage
        ? `<a class="bi-home-btn" href="${misc.homepage}" target="_blank" rel="noopener">${misc.name} Homepage &#8599;</a>`
        : "";
      wrap.innerHTML = `
        <div class="brand-info">
          <div class="bi-logo-row">
            <div class="bi-logo-wrap">${logoHtml}</div>
            ${homeBtn}
          </div>
        </div>`;
      if (brandDocOpen) closeBrandDoc(false);
      return;
    }
    const homeBtn = misc.homepage
      ? `<a class="bi-home-btn" href="${misc.homepage}" target="_blank" rel="noopener">공식 홈페이지 &#8599;</a>`
      : "";
    wrap.innerHTML = `
      <div class="brand-info">
        <div class="bi-logo-row">
          <div class="bi-logo-wrap">${logoHtml}</div>
          ${homeBtn}
        </div>
        <div class="bi-body">
          <p class="bi-name">${meta ? meta[1] : ""}</p>
          <p class="bi-summary">${info.summary || ""}</p>
          <div class="bi-facts">
            ${info.founded ? `<div class="bi-fact"><b>Founded</b>${info.founded}</div>` : ""}
            ${info.hq ? `<div class="bi-fact"><b>HQ</b>${info.hq}</div>` : ""}
            ${info.signature ? `<div class="bi-fact"><b>Signature</b>${info.signature}</div>` : ""}
          </div>
          <div class="bi-actions">
            <button class="bi-detail-btn" onclick="openBrandDoc()">브랜드 히스토리 보기</button>
            ${info.source_url ? `<a class="bi-source-link" href="${info.source_url}" target="_blank" rel="noopener">원본 문서${info.source_url.includes("atlassian.net") ? " (Confluence)" : ""}</a>` : ""}
          </div>
        </div>
      </div>`;
  }

  function renderBrandDoc() {
    const info = BRAND_HISTORY[state.brand];
    if (!info) { closeBrandDoc(false); return; }
    document.getElementById("brandDocView").innerHTML = `
      <div class="brand-doc">
        <div class="brand-doc-hdr">
          <button class="brand-doc-back" onclick="closeBrandDoc()">&larr; 목록으로</button>
        </div>
        <div class="brand-doc-body">${info.html}</div>
      </div>`;
  }

  function openBrandDoc(record) {
    brandDocOpen = true;
    renderBrandDoc();
    document.getElementById("mainGridView").style.display = "none";
    document.getElementById("brandDocView").style.display = "block";
    if (record !== false) pushNav({ type: "branddoc", brand: state.brand });
    updateNavButtons();
  }

  function closeBrandDoc(record) {
    brandDocOpen = false;
    document.getElementById("mainGridView").style.display = "";
    document.getElementById("brandDocView").style.display = "none";
    if (record !== false) pushNav({ type: "home" });
    updateNavButtons();
  }

  function matchFilters(p, overrides) {
    const s = Object.assign({}, state, overrides || {});
    if (s.cont && s.cont !== "all" && p.continent !== s.cont) return false;
    if (s.cat && s.cat !== "all" && p.category !== s.cat) return false;
    if (s.type && s.type !== "all" && p.type !== s.type) return false;
    if (s.config && s.config !== "all" && p.config !== s.config) return false;
    if (s.brand && s.brand !== "all" && p.brand_id !== s.brand) return false;
    if (s.year && s.year !== "all" && p.year_bucket !== s.year) return false;
    if (s.q) {
      const q = s.q.toLowerCase();
      if (!(p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || (p.desc || "").toLowerCase().includes(q))) return false;
    }
    return true;
  }

  function renderGrid() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    const list = DATA.filter(p => matchFilters(p));
    document.getElementById("gridMeta").textContent = list.length + "개 제품";
    if (list.length === 0) {
      grid.innerHTML = '<div class="state"><div class="ico">&#129681;</div><p>조건에 맞는 제품이 없습니다.</p></div>';
      return;
    }
    list.forEach(p => {
      const card = document.createElement("div");
      card.className = "card" + (selected === p ? " sel" : "");
      const logoHtml = p.logo
        ? `<div class="logochip" data-brand="${p.brand_id}"><img src="${p.logo}" alt="${p.brand}"></div>`
        : `<div class="logochip textonly">${p.brand}</div>`;
      card.innerHTML = `
        <div class="imgwrap">
          <img class="pimg" src="${(p.images[0] || "")}" alt="${p.name}" loading="lazy" onerror="this.style.opacity=0">
          ${logoHtml}
          <button class="copy-btn" title="이미지 복사">${COPY_ICON}</button>
        </div>
        <div class="body">
          <p class="pname">${p.name}</p>
          <p class="brandname">${p.brand}</p>
          <div class="tags">
            <span class="tag cont-${p.continent}">${contLabel[p.continent]}</span>
            ${p.category ? `<span class="tag">${p.category}</span>` : ""}
            ${p.type ? `<span class="tag">${p.type}</span>` : ""}
            ${p.year ? `<span class="tag">${p.year}</span>` : ""}
          </div>
          <span class="price">${p.price || ""}</span>
        </div>`;
      card.querySelector(".copy-btn").addEventListener("click", (e) => { e.stopPropagation(); copyImage((p.images[0] || ""), e.currentTarget); });
      const logoChip = card.querySelector(".logochip");
      if (logoChip) logoChip.addEventListener("click", (e) => { e.stopPropagation(); filterByBrand(p); });
      card.addEventListener("click", () => selectCard(p));
      grid.appendChild(card);
    });
  }

  function filterByBrand(p) {
    state.brand = p.brand_id;
    state.cont = p.continent;
    closeDetail(false);
    refresh();
  }

  function selectCard(p, record) {
    selected = p;
    detIndex = 0;
    closeSidebar();
    document.getElementById("detail").classList.remove("hide");
    document.getElementById("detEmpty").style.display = "none";
    const filled = document.getElementById("detFilled");
    filled.style.display = "flex";
    document.getElementById("dImg").src = (p.images[0] || "");
    document.getElementById("dBrand").textContent = p.brand;
    const logoEl = document.getElementById("dLogo");
    if (p.logo) { logoEl.src = p.logo; logoEl.dataset.brand = p.brand_id; logoEl.style.display = "block"; } else { logoEl.style.display = "none"; }
    document.getElementById("dBrandRow").onclick = () => filterByBrand(p);
    document.getElementById("dName").textContent = p.name;
    document.getElementById("dDesc").textContent = p.desc;
    document.getElementById("dPriceRow").style.display = p.price ? "" : "none";
    document.getElementById("dPrice").textContent = p.price || "";
    document.getElementById("dYear").textContent = p.year || "미상";
    document.getElementById("dCategory").textContent = p.category || "—";
    document.getElementById("dType").textContent = p.type || "—";
    document.getElementById("dMaterial").textContent = p.material || "—";
    document.getElementById("dConfig").textContent = p.config || "—";
    document.getElementById("dDesigner").textContent = p.designer || "—";
    document.getElementById("dLink").href = p.url;
    renderDots();
    renderGrid();
    if (record !== false) pushNav({ type: "detail", product: p });
    updateNavButtons();
  }

  function closeDetail(record) {
    selected = null;
    document.getElementById("detail").classList.add("hide");
    renderGrid();
    if (record !== false) pushNav({ type: "home" });
    updateNavButtons();
  }

  function pushNav(entry) {
    const top = navStack[navIndex];
    if (top && top.type === "home" && entry.type === "home") { updateNavButtons(); return; }
    navStack = navStack.slice(0, navIndex + 1);
    navStack.push(entry);
    navIndex = navStack.length - 1;
    updateNavButtons();
  }

  function updateNavButtons() {
    document.getElementById("btnBack").disabled = navIndex <= 0;
    document.getElementById("btnForward").disabled = navIndex >= navStack.length - 1;
  }

  function applyNavEntry(entry) {
    if (entry.type === "home") {
      if (brandDocOpen) closeBrandDoc(false);
      if (selected) closeDetail(false);
    } else if (entry.type === "detail") {
      if (brandDocOpen) closeBrandDoc(false);
      selectCard(entry.product, false);
    } else if (entry.type === "branddoc") {
      if (selected) closeDetail(false);
      state.brand = entry.brand;
      refresh();
      openBrandDoc(false);
    }
    updateNavButtons();
  }

  function goBack() {
    if (navIndex > 0) { navIndex--; applyNavEntry(navStack[navIndex]); }
  }

  function goForward() {
    if (navIndex < navStack.length - 1) { navIndex++; applyNavEntry(navStack[navIndex]); }
  }

  function goHome() {
    state = { cont: "all", cat: "all", type: "all", brand: "all", year: "all", q: "" };
    document.getElementById("searchInp").value = "";
    if (brandDocOpen) closeBrandDoc(false);
    if (selected) closeDetail(false);
    refresh();
    pushNav({ type: "home" });
  }

  function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("sidebarBackdrop").classList.toggle("show");
  }
  function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarBackdrop").classList.remove("show");
  }
  document.getElementById("sidebar").addEventListener("click", (e) => {
    if (e.target.closest(".fb") && window.innerWidth <= 860) closeSidebar();
  });

  function refresh() {
    document.getElementById("brandAllBtn").classList.toggle("on", state.cont === "all" && state.brand === "all");
    renderYearList();
    renderCatList();
    renderTypeList();
    renderConfigList();
    renderBrandList();
    renderBrandInfo();
    renderGrid();
  }

  document.getElementById("brandAllBtn").addEventListener("click", () => {
    state.cont = "all"; state.brand = "all"; refresh();
  });

  document.getElementById("typeAllBtn").addEventListener("click", () => {
    state.type = "all"; refresh();
  });

  document.getElementById("catAllBtn").addEventListener("click", () => {
    state.cat = "all"; refresh();
  });

  document.getElementById("configAllBtn").addEventListener("click", () => {
    state.config = "all"; refresh();
  });

  document.getElementById("searchInp").addEventListener("input", (e) => {
    state.q = e.target.value;
    renderGrid();
  });

  refresh();
</script>
